      - name: Verify V0.1.5 source markers
        shell: bash
        run: |
          set -euo pipefail

          grep -F 'versionCode = 15' android/app/build.gradle.kts
          grep -F 'versionName = "0.1.5"' android/app/build.gradle.kts
          grep -F 'CURRENT_VERSION = "0.1.5"' android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt
          grep -F 'val version: String = "0.1.5"' android/app/src/main/java/com/jadegenesis/mobile/model/Models.kt
          grep -F 'runtimeVersion = "0.1.5"' android/app/src/main/java/com/jadegenesis/mobile/node/NodeManager.kt
          grep -F '"research_engine_v3"' android/app/src/main/java/com/jadegenesis/mobile/node/NodeManager.kt
          grep -F 'ResearchEngine v3 entity-router' android/app/src/main/java/com/jadegenesis/mobile/selfmodel/SelfModelBuilder.kt
          grep -F 'Perception ciblée + Research v3' android/app/src/main/java/com/jadegenesis/mobile/ui/JadeApp.kt
          grep -F 'data class ResearchTarget' android/app/src/main/java/com/jadegenesis/mobile/research/ResearchEngine.kt
          grep -F 'extractGithubRepositories' android/app/src/main/java/com/jadegenesis/mobile/research/ResearchEngine.kt
          grep -F 'githubRepositoryEvidence' android/app/src/main/java/com/jadegenesis/mobile/research/ResearchEngine.kt
          grep -F 'githubRepositorySearch' android/app/src/main/java/com/jadegenesis/mobile/research/ResearchEngine.kt
          grep -F 'primarySourceCount' android/app/src/main/java/com/jadegenesis/mobile/research/ResearchEngine.kt
          grep -F 'RESEARCH_CANDIDATE_V3' android/app/src/main/java/com/jadegenesis/mobile/core/JadeCore.kt
          grep -F 'visual_research_v3_completed' android/app/src/main/java/com/jadegenesis/mobile/core/JadeCore.kt
          grep -F 'this@FocusCropActivity' android/app/src/main/java/com/jadegenesis/mobile/screen/FocusCropActivity.kt
          grep -F 'extractsGithubRepositoryFromLabeledVisionText' android/app/src/test/java/com/jadegenesis/mobile/research/ResearchEngineTest.kt

          if grep -F 'RESEARCH_CANDIDATE_V3' android/app/src/main/java/com/jadegenesis/mobile/core/JadeCore.kt | grep -F 'MemoryType.KNOWLEDGE' >/dev/null; then
            echo "ERROR: Research v3 must not auto-promote visual research to stable KNOWLEDGE."
