name: Build Jade Genesis Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Extract Android project
        run: |
          unzip -o jade-genesis-android-0.0.1.zip

      - name: Patch Android project for AGP 9
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "jade-genesis-android-0.0.1/app/build.gradle.kts"
          )

          text = path.read_text(encoding="utf-8")

          # Android SDK 37 -> 36
          text = text.replace(
              "compileSdk = 37",
              "compileSdk = 36"
          )

          text = text.replace(
              "targetSdk = 37",
              "targetSdk = 36"
          )

          # AGP 9 possède désormais le support Kotlin intégré.
          # On retire donc l'ancien plugin Kotlin Android.
          text = re.sub(
              r'(?m)^\s*id\("org\.jetbrains\.kotlin\.android"\)\s*\n?',
              '',
              text
          )

          # Suppression de l'ancien bloc :
          #
          # kotlinOptions {
          #     jvmTarget = "17"
          # }
          text = re.sub(
              r'(?ms)^\s*kotlinOptions\s*\{\s*.*?^\s*\}\s*\n?',
              '',
              text
          )

          path.write_text(text, encoding="utf-8")

          print("===== build.gradle.kts après correction =====")
          print(text)
          PY

      - name: Build Android APK
        run: |
          gradle \
            -p jade-genesis-android-0.0.1 \
            :app:assembleDebug \
            --stacktrace

      - name: Upload Jade Genesis APK
        uses: actions/upload-artifact@v4
        with:
          name: Jade-Genesis-Android-0.0.1
          path: jade-genesis-android-0.0.1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
