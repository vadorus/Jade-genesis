          package com.jadegenesis.mobile.research
          
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test
          
          class ResearchEngineTest {
          
              private val engine = ResearchEngine()
          
              @Test
              fun extractsGithubRepositoryFromLabeledVisionText() {
                  val text = """
                      **Visible**
                      * **URL GitHub :** `github.com/vadorus`
                      * **Nom du dépôt :** / Jade-genesis
                      * **Nom d'utilisateur :** "vadorus"
                      * **Liste des fichiers :** `.github/workflows`, `android`, `README.md`
                  """.trimIndent()
          
                  val targets = engine.extractGithubRepositories(text)
          
                  assertTrue(targets.any { it.canonical == "vadorus/Jade-genesis" })
              }
          
              @Test
              fun extractsGithubRepositoryFromCanonicalUrl() {
                  val targets = engine.extractGithubRepositories(
                      "Dépôt visible : https://github.com/vadorus/Jade-genesis"
                  )
          
                  assertEquals("vadorus/Jade-genesis", targets.first().canonical)
              }
          
              @Test
              fun githubRepositoryBecomesFirstResearchQuery() {
                  val observation = """
                      URL GitHub : github.com/vadorus/Jade-genesis
                      Android
                      README.md
                  """.trimIndent()
          
                  val queries = engine.buildResearchQueries(
                      observation = observation,
                      focusInstruction = "Vérifie ce dépôt avec des données publiques"
                  )
          
                  assertEquals("vadorus/Jade-genesis GitHub", queries.first())
              }
          
              @Test
              fun githubWorkflowPathIsNotTreatedAsRepository() {
                  val targets = engine.extractGithubRepositories(
                      "GitHub affiche le dossier .github/workflows et le fichier README.md"
                  )
          
                  assertFalse(targets.any { it.canonical.endsWith("/workflows") })
              }
          }
