      - name: Clean stale Android builds
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/jade-v014-clean.sh

      - name: Test and build V0.1.5 with persistent Gradle log
        id: gradle_build
        shell: bash
        run: |
          set -uo pipefail

          LOG="$RUNNER_TEMP/v015-build.log"

          echo "=== Jade Genesis V0.1.5 Research v3 Android verification ===" | tee "$LOG"
          echo "run_id=$GITHUB_RUN_ID" | tee -a "$LOG"
          echo "run_attempt=$GITHUB_RUN_ATTEMPT" | tee -a "$LOG"
          echo "commit=$GITHUB_SHA" | tee -a "$LOG"
          echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$LOG"
          echo | tee -a "$LOG"

          set +e
          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            -p android \
            :app:testDebugUnitTest \
            :app:assembleDebug 2>&1 | tee -a "$LOG"
          GRADLE_STATUS=${PIPESTATUS[0]}
          set -e

          echo | tee -a "$LOG"
          echo "gradle_exit_code=$GRADLE_STATUS" | tee -a "$LOG"
          echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$LOG"

          exit "$GRADLE_STATUS"

      - name: Upload V0.1.5 Gradle log on failure
        if: failure() && steps.gradle_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: jade-v015-gradle-failure-log
          path: ${{ runner.temp }}/v015-build.log
          if-no-files-found: error
          retention-days: 30

      - name: Verify APK version 0.1.5
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" \
            | tee "$RUNNER_TEMP/v015-badging.txt"

          grep -F "package: name='com.jadegenesis.mobile'" "$RUNNER_TEMP/v015-badging.txt"
          grep -F "versionCode='15'" "$RUNNER_TEMP/v015-badging.txt"
          grep -F "versionName='0.1.5'" "$RUNNER_TEMP/v015-badging.txt"

          sha256sum "$APK" | tee "$RUNNER_TEMP/v015-apk.sha256"

