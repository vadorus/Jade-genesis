name: Jade Node Agent CI

on:
  push:
    branches:
      - main
      - "jade/**"
    paths:
      - "node-agent/**"
      - ".github/workflows/jade-node-agent-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "node-agent/**"
      - ".github/workflows/jade-node-agent-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jade-node-agent-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Test bounded node-agent learning and supervision
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "node-agent/*.py"

      - name: Compile node-agent Python sources
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q node-agent

      - name: Run complete node-agent unit test suite
        shell: bash
        run: |
          set -euo pipefail
          cd node-agent
          python -m unittest discover -p 'test_*.py' -v

      - name: Guard 0.1.17 outcome-learning safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path("node-agent/night_learning_lab.py").read_text(encoding="utf-8")
          required = [
              '"raw_conversation_text_used": False',
              '"user_feedback_promoted_to_external_fact": False',
              '"automatic_experiment_execution": False',
              '"automatic_promotion": False',
              '"production_code_rewrite": False',
              '"shell_execution": False',
              '"STRATEGY_HINT"',
              'routing.profile_model_preference',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"Missing outcome-learning safety invariant(s): {missing}")
          print("Outcome-learning safety invariants verified.")
          PY
