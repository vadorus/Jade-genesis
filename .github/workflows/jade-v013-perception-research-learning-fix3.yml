      - name: Verify V0.1.3 source before build
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 13' android/app/build.gradle.kts
          grep -F 'versionName = "0.1.3"' android/app/build.gradle.kts
          grep -F 'CURRENT_VERSION = "0.1.3"' \
            android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt
          grep -F 'class ResearchEngine' \
            android/app/src/main/java/com/jadegenesis/mobile/research/ResearchEngine.kt
          grep -F 'class VisualLearningStore' \
            android/app/src/main/java/com/jadegenesis/mobile/cognitive/VisualLearningStore.kt
          grep -F 'deepResearchLastVisualObservation' \
            android/app/src/main/java/com/jadegenesis/mobile/core/JadeCore.kt
          grep -F 'Approfondir avec des données publiques' \
            android/app/src/main/java/com/jadegenesis/mobile/ui/JadeApp.kt
          grep -F 'ResearchEngine v1 public-data' \
            android/app/src/main/java/com/jadegenesis/mobile/selfmodel/SelfModelBuilder.kt
          grep -F 'type = MemoryType.HYPOTHESIS' \
            android/app/src/main/java/com/jadegenesis/mobile/core/JadeCore.kt
          if grep -F 'MemoryType.KNOWLEDGE' android/app/src/main/java/com/jadegenesis/mobile/core/JadeCore.kt | grep -F 'report.evidence' >/dev/null; then
            echo "ERROR: V0.1.3 must not auto-promote visual research to stable KNOWLEDGE."
            exit 1
          fi
          grep -F 'VERSION = "0.1.1"' node-agent/jade_node_agent.py
          python3 -m py_compile node-agent/jade_node_agent.py

      - name: Remove every stale Android build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/.gradle android/build android/app/build
          find android -type f -name '*.apk' -delete

      - name: Build V0.1.3 from scratch with real Gradle
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            -p android \
            :app:assembleDebug

      - name: Verify APK really is Jade Genesis 0.1.3
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.jadegenesis.mobile'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionCode='13'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionName='0.1.3'" "$RUNNER_TEMP/badging.txt"
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk.sha256"

      - name: Verify stable Jade APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SIGNATURE_FILE="$RUNNER_TEMP/signature.txt"
          EXPECTED_DIGEST="0b74e3f3d627ebd7f53454caf8dca65312099de702171af8bfb3a674fd484992"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | tee "$SIGNATURE_FILE"

          grep -F "Number of signers: 1" "$SIGNATURE_FILE" >/dev/null
          ACTUAL_DIGEST="$(
            sed -n 's/^Signer #1 certificate SHA-256 digest:[[:space:]]*//p' "$SIGNATURE_FILE" \
              | head -n 1 \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d ':[:space:]'
          )"

          if [ -z "$ACTUAL_DIGEST" ]; then
            echo "ERROR: unable to read APK signer SHA-256 digest."
            exit 1
          fi

          if [ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "ERROR: APK signer fingerprint does not match the stable Jade key."
            exit 1
          fi

          echo "Stable Jade signing fingerprint verified."

      - name: Package verified V0.1.3 APK and compatible runtime
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/jade-v013"
          mkdir -p "$OUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "$OUT/Jade-Genesis-0.1.3.apk"
          cp node-agent/jade_node_agent.py "$OUT/jade_node_agent_0.1.1.py"
          cp "$RUNNER_TEMP/apk.sha256" "$OUT/Jade-Genesis-0.1.3.apk.sha256.txt"
          cat > "$OUT/README.txt" <<'TXT'
          Jade Genesis 0.1.3 — Perception + Research + Learning v1

          Android:
          - Screen perception remains on-demand.
          - Visual observations become provenance-aware learning candidates.
          - "Approfondir avec des données publiques" performs a second research stage.
          - The image itself is not sent to public Internet research sources.
          - Only a shortened/redacted text query is used by ResearchEngine.
          - Public-data providers in v1: French Wikipedia, Wikidata, and GitHub issues for technical topics.
          - Findings remain candidates/knowledge with confidence; research is not silently treated as ground truth.

          Distributed runtime:
          - PC/VPS Node Runtime 0.1.1 remains compatible; no token or Node ID reset is needed.
          TXT

