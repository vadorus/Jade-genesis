name: Jade V0.1.4 Observability Fix 2

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/jade-v014-observability-fix2.yml"

permissions:
  contents: write

jobs:
  patch-v014-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch V0.1.4 build observability
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          target = Path(".github/workflows/jade-v014-targeted-observation-research-v2.yml")
          if not target.is_file():
              raise SystemExit(f"ERROR: target workflow not found: {target}")

          text = target.read_text(encoding="utf-8")

          # Disable manual reruns of this source-mutating workflow.
          text = text.replace("  workflow_dispatch:\n", "", 1)

          start_marker = "      - name: Build V0.1.4 from scratch with real Gradle\n"
          end_marker = "      - name: Verify APK really is Jade Genesis 0.1.4\n"

          if "id: gradle_build" in text and "ci-logs/v014-build.log" in text:
              print("V0.1.4 observability patch is already present.")
          else:
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(
                      "ERROR: V0.1.4 Gradle build step not found. "
                      "Refusing to patch a moving base."
                  )

              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(
                      "ERROR: V0.1.4 APK verification step not found. "
                      "Refusing to patch a moving base."
                  )

              current = text[start:end]
              required = (
                  "gradle",
                  "--no-daemon",
                  "--stacktrace",
                  "--console=plain",
                  "-p android",
                  ":app:assembleDebug",
              )
              missing = [item for item in required if item not in current]
              if missing:
                  raise SystemExit(
                      "ERROR: unexpected V0.1.4 Gradle block; missing: "
                      + ", ".join(missing)
                  )

              replacement = r'''      - name: Build V0.1.4 from scratch with real Gradle
                id: gradle_build
                shell: bash
                run: |
                  set -uo pipefail
                  mkdir -p ci-logs
                  LOG="$GITHUB_WORKSPACE/ci-logs/.v014-build.log"

                  echo "=== Jade Genesis V0.1.4 Android build ===" | tee "$LOG"
                  echo "run_id=$GITHUB_RUN_ID" | tee -a "$LOG"
                  echo "run_attempt=$GITHUB_RUN_ATTEMPT" | tee -a "$LOG"
                  echo "commit=$GITHUB_SHA" | tee -a "$LOG"
                  echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$LOG"
                  echo | tee -a "$LOG"

                  set +e
                  gradle \
                    --no-daemon \
                    --stacktrace \
                    --console=plain \
                    -p android \
                    :app:assembleDebug 2>&1 | tee -a "$LOG"
                  GRADLE_STATUS=${PIPESTATUS[0]}
                  set -e

                  echo | tee -a "$LOG"
                  echo "gradle_exit_code=$GRADLE_STATUS" | tee -a "$LOG"
                  echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$LOG"

                  exit "$GRADLE_STATUS"

              - name: Upload V0.1.4 Gradle failure log
                if: failure() && steps.gradle_build.outcome == 'failure'
                uses: actions/upload-artifact@v4
                with:
                  name: jade-v014-gradle-failure-log
                  path: ci-logs/.v014-build.log
                  if-no-files-found: error
                  retention-days: 30

              - name: Persist V0.1.4 Gradle failure log in repository
                if: failure() && steps.gradle_build.outcome == 'failure'
                shell: bash
                run: |
                  set -euo pipefail
                  SRC="ci-logs/.v014-build.log"
                  DST="ci-logs/v014-build.log"
                  test -f "$SRC"

                  {
                    echo "Jade Genesis V0.1.4 build failure"
                    echo "workflow_run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                    echo "source_commit=$GITHUB_SHA"
                    echo
                    cat "$SRC"
                  } > "$DST"

                  git config user.name "Jade Genesis CI"
                  git config user.email "actions@jade-genesis.local"
                  git add -f "$DST"

                  if git diff --cached --quiet; then
                    echo "No new failure log to commit."
                    exit 0
                  fi

                  git commit -m "ci: persist V0.1.4 Gradle failure log"
                  git push origin HEAD:main

          '''

              text = text[:start] + replacement + text[end:]

          target.write_text(text, encoding="utf-8")
          print("V0.1.4 workflow patched successfully.")
          PY

      - name: Verify patch before commit
        shell: bash
        run: |
          set -euo pipefail
          TARGET=".github/workflows/jade-v014-targeted-observation-research-v2.yml"

          grep -F 'id: gradle_build' "$TARGET"
          grep -F 'PIPESTATUS[0]' "$TARGET"
          grep -F 'actions/upload-artifact@v4' "$TARGET"
          grep -F 'ci-logs/v014-build.log' "$TARGET"
          grep -F "if: failure() && steps.gradle_build.outcome == 'failure'" "$TARGET"

          if grep -F '  workflow_dispatch:' "$TARGET" >/dev/null; then
            echo "ERROR: workflow_dispatch is still enabled on V0.1.4."
            exit 1
          fi

          git diff --check

      - name: Commit patched V0.1.4 workflow
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Jade Genesis CI"
          git config user.email "actions@jade-genesis.local"

          git add .github/workflows/jade-v014-targeted-observation-research-v2.yml

          if git diff --cached --quiet; then
            echo "Nothing to commit; V0.1.4 workflow is already patched."
            exit 0
          fi

          git commit -m "ci: make V0.1.4 Gradle failure observable"
          git push origin HEAD:main

      - name: Final status
        run: |
          echo "Fix 2 applied."
          echo "V0.1.4 will run automatically because its workflow YAML changed."
          echo "If Gradle fails, read ci-logs/v014-build.log."
