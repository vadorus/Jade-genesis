name: Jade Repo-First Bootstrap V0.1.4

on:
  push:
    branches:
      - "jade/v015-repo-first"
    paths:
      - ".github/workflows/jade-repo-first-bootstrap.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: jade-repo-first-bootstrap
  cancel-in-progress: false

jobs:
  materialize-verified-sources:
    if: github.ref_name == 'jade/v015-repo-first'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guard branch and repository
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = "vadorus/Jade-genesis"
          test "$GITHUB_REF_NAME" = "jade/v015-repo-first"

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "ERROR: bootstrap must never run on main."
            exit 1
          fi

          echo "Repo-first bootstrap authorized on: $GITHUB_REF_NAME"

      - name: Download verified V0.1.4 source artifact
        uses: actions/download-artifact@v4
        with:
          name: Jade-Genesis-0.1.4-verified-sources
          path: ${{ runner.temp }}/jade-v014-verified
          github-token: ${{ github.token }}
          repository: vadorus/Jade-genesis
          run-id: 33998508189

      - name: Verify trusted V0.1.4 artifact metadata
        shell: bash
        run: |
          set -euo pipefail

          SRC="$RUNNER_TEMP/jade-v014-verified"
          META="$SRC/VERIFIED.txt"

          test -f "$META"
          test -f "$SRC/build.gradle.kts"
          test -d "$SRC/main"

          grep -Fx 'Jade Genesis V0.1.4 verified sources' "$META"
          grep -Fx 'workflow_run=https://github.com/vadorus/Jade-genesis/actions/runs/33998508189' "$META"
          grep -Fx 'versionCode=14' "$META"
          grep -Fx 'versionName=0.1.4' "$META"
          grep -Fx 'apk_sha256=c4879220db7e8aa856748fc612ad22264395d5c009cce61a3131c125a9f949e4' "$META"
          grep -Fx 'signing_sha256=0b74e3f3d627ebd7f53454caf8dca65312099de702171af8bfb3a674fd484992' "$META"

          echo "Verified V0.1.4 source artifact accepted."

      - name: Materialize verified sources into repository
        shell: bash
        run: |
          set -euo pipefail

          SRC="$RUNNER_TEMP/jade-v014-verified"

          rm -rf android/app/src/main
          mkdir -p android/app/src

          cp "$SRC/build.gradle.kts" android/app/build.gradle.kts
          cp -a "$SRC/main" android/app/src/main

          echo "Verified Android sources materialized from artifact."

      - name: Verify materialized source markers
        shell: bash
        run: |
          set -euo pipefail

          grep -F 'versionCode = 14' android/app/build.gradle.kts
          grep -F 'versionName = "0.1.4"' android/app/build.gradle.kts

          grep -F 'CURRENT_VERSION = "0.1.4"' \
            android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt

          grep -F 'runtimeVersion = "0.1.4"' \
            android/app/src/main/java/com/jadegenesis/mobile/node/NodeManager.kt

          grep -F 'class FocusCropActivity' \
            android/app/src/main/java/com/jadegenesis/mobile/screen/FocusCropActivity.kt

          COUNT="$(grep -cF 'this@FocusCropActivity' \
            android/app/src/main/java/com/jadegenesis/mobile/screen/FocusCropActivity.kt)"

          if [ "$COUNT" -ne 2 ]; then
            echo "ERROR: expected exactly 2 verified FocusCropActivity context markers, got $COUNT"
            exit 1
          fi

          grep -F 'buildResearchQueries' \
            android/app/src/main/java/com/jadegenesis/mobile/research/ResearchEngine.kt

          grep -F 'type = MemoryType.HYPOTHESIS' \
            android/app/src/main/java/com/jadegenesis/mobile/core/JadeCore.kt

          echo "Materialized V0.1.4 markers verified."

      - name: Enforce repo-first write allowlist
        shell: bash
        run: |
          set -euo pipefail

          git status --short

          CHANGED="$(git diff --name-only)"

          if [ -z "$CHANGED" ]; then
            echo "ERROR: no source changes detected; bootstrap has nothing to materialize."
            exit 1
          fi

          echo "=== Files changed by bootstrap ==="
          printf '%s\n' "$CHANGED"

          if printf '%s\n' "$CHANGED" \
            | grep -Ev '^(android/app/build\.gradle\.kts|android/app/src/main/)'; then
            echo "ERROR: bootstrap attempted to modify a path outside the source allowlist."
            exit 1
          fi

          if printf '%s\n' "$CHANGED" | grep -E '^\.github/'; then
            echo "ERROR: bootstrap must never modify workflows."
            exit 1
          fi

          echo "Repo-first source allowlist verified."

      - name: Commit verified V0.1.4 sources to candidate branch
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REF_NAME" = "jade/v015-repo-first"

          git add android/app/build.gradle.kts android/app/src/main

          if git diff --cached --quiet; then
            echo "ERROR: nothing staged."
            exit 1
          fi

          if git diff --cached --name-only \
            | grep -Ev '^(android/app/build\.gradle\.kts|android/app/src/main/)'; then
            echo "ERROR: staged path outside repo-first source allowlist."
            exit 1
          fi

          git config user.name "Jade Genesis Repo-First Bootstrap"
          git config user.email "actions@jade-genesis.local"

          git commit -m "chore(repo-first): materialize verified V0.1.4 sources"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Final repository-source summary
        shell: bash
        run: |
          set -euo pipefail

          echo "Repo-first bootstrap complete."
          echo "branch=$GITHUB_REF_NAME"
          echo "commit=$(git rev-parse HEAD)"
          echo "versionCode=14"
          echo "versionName=0.1.4"
          echo "Source of truth: repository files, not YAML heredocs."
