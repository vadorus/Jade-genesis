name: Build Jade Genesis V0.1 Cognitive Core

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/jade-v010.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Restore stable Jade signing key
        shell: bash
        env:
          JADE_SIGNING_BUNDLE_B64: ${{ secrets.JADE_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${JADE_SIGNING_BUNDLE_B64:-}" ]; then
            echo "ERROR: GitHub secret JADE_SIGNING_BUNDLE_B64 is missing."
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/jade-signing"
          mkdir -p "$SIGN_DIR"
          printf '%s' "$JADE_SIGNING_BUNDLE_B64" | base64 -d > "$SIGN_DIR/signing.tar.gz"
          tar -xzf "$SIGN_DIR/signing.tar.gz" -C "$SIGN_DIR"

          test -f "$SIGN_DIR/jade-genesis-dev.jks"
          test -f "$SIGN_DIR/password.txt"
          test -f "$SIGN_DIR/alias.txt"

          PASSWORD="$(cat "$SIGN_DIR/password.txt")"
          ALIAS="$(cat "$SIGN_DIR/alias.txt")"
          echo "::add-mask::$PASSWORD"

          echo "JADE_KEYSTORE_PATH=$SIGN_DIR/jade-genesis-dev.jks" >> "$GITHUB_ENV"
          echo "JADE_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "JADE_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Apply complete V0.1 staged sources
        shell: bash
        run: |
          set -euo pipefail

