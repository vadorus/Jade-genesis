          grep -F 'class LocalPCBrain' android/app/src/main/java/com/jadegenesis/mobile/brain/LocalPCBrain.kt
          grep -F 'brain_chat' android/app/src/main/java/com/jadegenesis/mobile/brain/LocalPCBrain.kt
