name: Build Jade Genesis V0.1.1 Screen Observer Tool Lab

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/jade-v011-screen-tools.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout V0.1.1 sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up real Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37 and Build Tools 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Restore stable Jade signing key
        shell: bash
        env:
          JADE_SIGNING_BUNDLE_B64: ${{ secrets.JADE_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${JADE_SIGNING_BUNDLE_B64:-}" ]; then
            echo "ERROR: GitHub secret JADE_SIGNING_BUNDLE_B64 is missing."
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/jade-signing"
          mkdir -p "$SIGN_DIR"

          printf '%s' "$JADE_SIGNING_BUNDLE_B64" \
            | base64 -d > "$SIGN_DIR/signing.tar.gz"

          tar -xzf "$SIGN_DIR/signing.tar.gz" -C "$SIGN_DIR"

          test -f "$SIGN_DIR/jade-genesis-dev.jks"
          test -f "$SIGN_DIR/password.txt"
          test -f "$SIGN_DIR/alias.txt"

          PASSWORD="$(cat "$SIGN_DIR/password.txt")"
          ALIAS="$(cat "$SIGN_DIR/alias.txt")"

          echo "::add-mask::$PASSWORD"

          echo "JADE_KEYSTORE_PATH=$SIGN_DIR/jade-genesis-dev.jks" >> "$GITHUB_ENV"
          echo "JADE_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "JADE_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Apply V0.1.1 Screen Observer + Tool Lab + Registry stabilization
