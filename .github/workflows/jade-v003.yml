      - name: Store Jade 0.0.3 source in repository
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain -- android node-agent)" ]; then
            git config user.name "Jade Genesis CI"
            git config user.email "actions@users.noreply.github.com"

            git add android node-agent

            git commit \
              -m "Jade Genesis Android 0.0.3 Node Manager [skip ci]"

            git push origin HEAD:main
          else
            echo "Jade 0.0.3 source is already committed."
          fi

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

          grep -q 'versionName = "0.0.3"' \
            android/app/build.gradle.kts
          grep -q 'versionCode = 3' \
            android/app/build.gradle.kts

          test -f \
            android/app/src/main/java/com/jadegenesis/mobile/node/NodeManager.kt

          test -f node-agent/jade_node_agent.py
          python3 -m py_compile node-agent/jade_node_agent.py

      - name: Build Jade APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            -p android \
            :app:assembleDebug \
            --stacktrace

      - name: Verify APK and stable signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find android/app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK generated"
            exit 1
          fi

          echo "===== Jade APK ====="
          echo "$APK"

          SIGNATURE_OUTPUT="$(
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
              verify \
              --print-certs \
              "$APK"
          )"

          echo "$SIGNATURE_OUTPUT"

          ACTUAL="$(
            printf '%s\n' "$SIGNATURE_OUTPUT" \
              | sed -n \
                's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr '[:upper:]' '[:lower:]'
          )"

          EXPECTED="0b74e3f3d627ebd7f53454caf8dca65312099de702171af8bfb3a674fd484992"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Unexpected APK signing certificate."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          echo "Stable Jade signing certificate verified."

      - name: Upload Jade Genesis APK
        uses: actions/upload-artifact@v4
        with:
          name: Jade-Genesis-Android-0.0.3
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
