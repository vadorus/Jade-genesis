name: Build Jade Genesis Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Extract Android project
        run: |
          unzip -o jade-genesis-android-0.0.1.zip

      - name: Fix Android SDK versions
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/g' \
            jade-genesis-android-0.0.1/app/build.gradle.kts

          sed -i 's/targetSdk = 37/targetSdk = 36/g' \
            jade-genesis-android-0.0.1/app/build.gradle.kts

      - name: Fix Kotlin plugin for AGP 9
        run: |
          sed -i '/org.jetbrains.kotlin.android/d' \
            jade-genesis-android-0.0.1/app/build.gradle.kts

      - name: Build Android APK
        run: |
          gradle \
            -p jade-genesis-android-0.0.1 \
            :app:assembleDebug \
            --stacktrace

      - name: Upload Jade Genesis APK
        uses: actions/upload-artifact@v4
        with:
          name: jade-genesis-android-debug
          path: jade-genesis-android-0.0.1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
