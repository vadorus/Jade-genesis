name: Rebuild Jade Genesis V0.1 Clean

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/jade-v010-clean-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout V0.1 sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up real Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37 and Build Tools 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Restore stable Jade signing key
        shell: bash
        env:
          JADE_SIGNING_BUNDLE_B64: ${{ secrets.JADE_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${JADE_SIGNING_BUNDLE_B64:-}" ]; then
            echo "ERROR: GitHub secret JADE_SIGNING_BUNDLE_B64 is missing."
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/jade-signing"
          mkdir -p "$SIGN_DIR"

          printf '%s' "$JADE_SIGNING_BUNDLE_B64" \
            | base64 -d > "$SIGN_DIR/signing.tar.gz"

          tar -xzf "$SIGN_DIR/signing.tar.gz" -C "$SIGN_DIR"

          test -f "$SIGN_DIR/jade-genesis-dev.jks"
          test -f "$SIGN_DIR/password.txt"
          test -f "$SIGN_DIR/alias.txt"

          PASSWORD="$(cat "$SIGN_DIR/password.txt")"
          ALIAS="$(cat "$SIGN_DIR/alias.txt")"

          echo "::add-mask::$PASSWORD"

          echo "JADE_KEYSTORE_PATH=$SIGN_DIR/jade-genesis-dev.jks" >> "$GITHUB_ENV"
          echo "JADE_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "JADE_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Verify V0.1 source version before build
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/build.gradle.kts
          test -f android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt
          test -f android/app/src/main/java/com/jadegenesis/mobile/model/Models.kt

          grep -F 'versionCode = 10' android/app/build.gradle.kts
          grep -F 'versionName = "0.1.0"' android/app/build.gradle.kts
          grep -F 'const val CURRENT_VERSION = "0.1.0"' \
            android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt
          grep -F 'val version: String = "0.1.0"' \
            android/app/src/main/java/com/jadegenesis/mobile/model/Models.kt

          echo "Source V0.1.0 confirmed."

      - name: Validate Node Runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile node-agent/jade_node_agent.py

      - name: Remove every stale Android build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android/.gradle
          rm -rf android/build
          rm -rf android/app/build

          if [ -e android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: stale APK still exists after cleanup."
            exit 1
          fi

          echo "Old Gradle state and APK outputs removed."

      - name: Build V0.1 from scratch with real Gradle
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail

          gradle --version

          gradle \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace \
            clean \
            :app:assembleDebug

      - name: Verify APK really is Jade Genesis 0.1.0
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          META="android/app/build/outputs/apk/debug/output-metadata.json"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          test -f "$APK"
          test -f "$META"
          test -x "$AAPT"

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("android/app/build/outputs/apk/debug/output-metadata.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          elements = data.get("elements") or []

          if len(elements) != 1:
              raise SystemExit(f"Unexpected APK metadata elements: {len(elements)}")

          item = elements[0]
          version_code = item.get("versionCode")
          version_name = item.get("versionName")

          print(f"output-metadata: versionCode={version_code}, versionName={version_name}")

          if version_code != 10:
              raise SystemExit(
                  f"ERROR: APK metadata versionCode is {version_code}, expected 10."
              )

          if version_name != "0.1.0":
              raise SystemExit(
                  f"ERROR: APK metadata versionName is {version_name}, expected 0.1.0."
              )
          PY

          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | head -n 1)"
          echo "$PACKAGE_LINE"

          printf '%s\n' "$PACKAGE_LINE" \
            | grep -F "package: name='com.jadegenesis.mobile'"

          printf '%s\n' "$PACKAGE_LINE" \
            | grep -F "versionCode='10'"

          printf '%s\n' "$PACKAGE_LINE" \
            | grep -F "versionName='0.1.0'"

          echo "APK manifest independently confirmed as Jade Genesis 0.1.0."

      - name: Verify stable Jade APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          EXPECTED="0B:74:E3:F3:D6:27:EB:D7:F5:34:54:CA:F8:DC:A6:53:12:09:9D:E7:02:17:1A:F8:BF:B3:A6:74:FD:48:49:92"

          test -x "$APKSIGNER"

          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY_OUTPUT"

          HEX="$(
            printf '%s\n' "$VERIFY_OUTPUT" \
              | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([0-9a-fA-F]+).*/\1/p' \
              | head -n 1
          )"

          if [ -z "$HEX" ]; then
            echo "ERROR: unable to read APK signer SHA-256 digest."
            exit 1
          fi

          ACTUAL="$(
            printf '%s' "$HEX" \
              | tr '[:lower:]' '[:upper:]' \
              | fold -w2 \
              | paste -sd: -
          )"

          echo "Expected signer: $EXPECTED"
          echo "Actual signer:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Jade stable signature mismatch."
            exit 1
          fi

          echo "Stable Jade signing key confirmed."

      - name: Package only the verified V0.1 APK and runtime
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="$RUNNER_TEMP/Jade-Genesis-0.1.0"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          cp "$APK" "$OUT/Jade-Genesis-0.1.0.apk"
          cp node-agent/jade_node_agent.py "$OUT/jade_node_agent.py"

          (
            cd "$OUT"
            sha256sum Jade-Genesis-0.1.0.apk jade_node_agent.py > SHA256SUMS.txt
          )

          echo "Verified bundle contents:"
          ls -lh "$OUT"
          cat "$OUT/SHA256SUMS.txt"

      - name: Stop tracking generated Android build files
        shell: bash
        run: |
          set -euo pipefail

          cat > .gitignore <<'EOF'
          # Jade Genesis - generated Android/Gradle files
          android/.gradle/
          android/build/
          android/app/build/
          android/local.properties

          # Python generated files
          __pycache__/
          *.pyc
          EOF

          git rm -r --cached --ignore-unmatch \
            android/.gradle \
            android/build \
            android/app/build \
            android/local.properties

          git add .gitignore

          if git diff --cached --quiet; then
            echo "No generated files were tracked."
          else
            git config user.name "Jade Genesis Builder"
            git config user.email "jade-genesis-builder@users.noreply.github.com"
            git commit -m "Stop tracking generated Android build files [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload verified Jade Genesis 0.1.0
        uses: actions/upload-artifact@v4
        with:
          name: Jade-Genesis-0.1.0-verified
          path: ${{ runner.temp }}/Jade-Genesis-0.1.0/
          if-no-files-found: error
          retention-days: 90
