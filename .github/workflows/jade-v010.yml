          cp "$SRC"/AdminGate.kt android/app/src/main/java/com/jadegenesis/mobile/diagnostics/AdminGate.kt
          cp "$SRC"/RuntimeManager.kt android/app/src/main/java/com/jadegenesis/mobile/runtime/RuntimeManager.kt
          cp "$SRC"/SelfModelBuilder.kt android/app/src/main/java/com/jadegenesis/mobile/selfmodel/SelfModelBuilder.kt
          cp "$SRC"/JadeCore.kt android/app/src/main/java/com/jadegenesis/mobile/core/JadeCore.kt
          cp "$SRC"/JadeViewModel.kt android/app/src/main/java/com/jadegenesis/mobile/ui/JadeViewModel.kt
          cp "$SRC"/JadeApp.kt android/app/src/main/java/com/jadegenesis/mobile/ui/JadeApp.kt
          cp "$SRC"/jade_node_agent.py node-agent/jade_node_agent.py

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "android/app/build.gradle.kts",
              'versionCode = 8\n        versionName = "0.0.8"',
              'versionCode = 10\n        versionName = "0.1.0"',
          )
          replace_once(
              "android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt",
              'const val CURRENT_VERSION = "0.0.8"',
              'const val CURRENT_VERSION = "0.1.0"',
          )
          PY

          grep -F 'versionCode = 10' android/app/build.gradle.kts
          grep -F 'versionName = "0.1.0"' android/app/build.gradle.kts
          grep -F 'CURRENT_VERSION = "0.1.0"' android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt
          grep -F 'class CognitiveCore' android/app/src/main/java/com/jadegenesis/mobile/cognitive/CognitiveCore.kt
          grep -F 'class ComputeMesh' android/app/src/main/java/com/jadegenesis/mobile/mesh/ComputeMesh.kt
          grep -F 'async_tasks_v1' android/app/src/main/java/com/jadegenesis/mobile/node/NodeManager.kt
          grep -F 'VERSION = "0.1.0"' node-agent/jade_node_agent.py

      - name: Validate Node Runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile node-agent/jade_node_agent.py

      - name: Test asynchronous runtime and VPS identity
        shell: bash
        run: |
          set -euo pipefail
          TEST_DIR="$RUNNER_TEMP/jade-v010-runtime-test"
          MOCK_DIR="$TEST_DIR/mock"
          RUNTIME_DIR="$TEST_DIR/runtime"
          VPS_DIR="$TEST_DIR/vps"
          mkdir -p "$MOCK_DIR" "$RUNTIME_DIR" "$VPS_DIR"

          cat > "$TEST_DIR/mock_ollama.py" <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              def _send(self, status, body):
                  data = json.dumps(body).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)

              def do_GET(self):
                  if self.path == "/api/tags":
                      self._send(200, {"models": [{"name": "qwen3:4b", "size": 123456}]})
                  else:
                      self._send(404, {"error": "not_found"})

              def do_POST(self):
                  if self.path != "/api/chat":
                      self._send(404, {"error": "not_found"})
                      return
                  length = int(self.headers.get("Content-Length", "0"))
                  request = json.loads(self.rfile.read(length).decode("utf-8"))
                  user_text = "\n".join(
                      str(item.get("content", ""))
                      for item in request.get("messages", [])
                      if item.get("role") == "user"
                  )
                  if "VERIFICATION STRUCTURÉE" in user_text:
                      content = '{"verdict":"ok","note":"CI verifier OK","confidence":0.92}'
                  else:
                      content = "Réponse asynchrone CI de Jade Genesis."
                  self._send(200, {"message": {"role": "assistant", "content": content}})

              def log_message(self, *args):
                  pass

          ThreadingHTTPServer(("127.0.0.1", 11435), Handler).serve_forever()
          PY

          python3 "$TEST_DIR/mock_ollama.py" >"$TEST_DIR/mock.log" 2>&1 &
          MOCK_PID=$!

          JADE_GENESIS_CONFIG_DIR="$RUNTIME_DIR" \
            python3 node-agent/jade_node_agent.py \
              --port 18765 \
              --ollama-url http://127.0.0.1:11435 \
              --brain-model qwen3:4b \
              --node-kind PC \
              --node-name "PC CI" \
              >"$TEST_DIR/runtime.log" 2>&1 &
          RUNTIME_PID=$!

          cleanup() {
            kill "$RUNTIME_PID" "$MOCK_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          python3 - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          config_path = Path(os.environ["RUNNER_TEMP"]) / "jade-v010-runtime-test" / "runtime" / "node-agent.json"
          deadline = time.time() + 12
          while time.time() < deadline and not config_path.exists():
              time.sleep(0.2)
          if not config_path.exists():
              raise SystemExit("Runtime config not created")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          token = config["token"]
          print("::add-mask::" + token)

          def request(path, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = Request(
                  "http://127.0.0.1:18765" + path,
                  data=data,
                  method=method,
                  headers={
                      "X-Jade-Token": token,
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
              )
              with urlopen(req, timeout=4) as response:
                  return response.status, json.loads(response.read().decode("utf-8"))

          deadline = time.time() + 12
          health = None
          while time.time() < deadline:
              try:
                  _, health = request("/health")
                  break
              except Exception:
                  time.sleep(0.3)
          if not health:
              raise SystemExit("Runtime /health unavailable")
          assert health["agent_version"] == "0.1.0", health
          assert health["kind"] == "PC", health
          assert "async_tasks_v1" in health["capabilities"], health
          assert "brain_chat" in health["capabilities"], health

          status, runtime = request("/runtime")
          assert status == 200
          assert runtime["runtime_version"] == "0.1.0", runtime
          assert runtime["automatic_update_execution"] is False, runtime

          task_id = "ci-brain-chat-001"
          payload = {
              "identity": {"jade_id": "JG-CI", "name": "Jade Genesis", "version": "0.1.0"},
              "operation": "answer",
              "user_input": "Présente le test CI.",
              "self": {
                  "node_id": "pixel-ci",
                  "device": "Pixel CI",
                  "resource_mode": "BALANCED",
                  "preferred_compute_node": "PC CI",
                  "known_nodes": [
                      {
                          "node_id": "pc-ci",
                          "name": "PC CI",
                          "kind": "PC",
                          "status": "ONLINE",
                          "capabilities": ["brain_chat"],
                          "routes": [{"kind": "TAILSCALE", "host": "100.64.0.1", "port": 8765}],
                      }
                  ],
              },
              "memories": [],
          }
          status, accepted = request(
              "/tasks",
              method="POST",
              body={
                  "protocol": "jade-genesis-node/0.0.6",
                  "task_id": task_id,
                  "task_kind": "brain_chat",
                  "payload": json.dumps(payload, ensure_ascii=False),
                  "workload": "HEAVY",
                  "iterations": 0,
              },
          )
          assert status == 202, accepted
          assert accepted["task_id"] == task_id, accepted

          deadline = time.time() + 20
          item = None
          while time.time() < deadline:
              _, item = request("/tasks/" + task_id)
              if item["status"] in {"COMPLETED", "FAILED"}:
                  break
              time.sleep(0.25)
          assert item and item["status"] == "COMPLETED", item
          result = json.loads(item["result"])
          assert "Réponse asynchrone CI" in result["text"], result
          assert result["model"] == "qwen3:4b", result

          _, diagnostics = request("/diagnostics")
          assert diagnostics["success"] is True
          print("Async Local Brain runtime test: SUCCESS")
          PY

          JADE_GENESIS_CONFIG_DIR="$VPS_DIR" \
            python3 node-agent/jade_node_agent.py \
              --port 18766 \
              --node-kind VPS \
              --node-name "VPS CI" \
              --channel candidate \
              --show-config > "$TEST_DIR/vps-config.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "jade-v010-runtime-test" / "vps-config.json"
          config = json.loads(path.read_text(encoding="utf-8"))
          assert config["node_kind"] == "VPS", config
          assert config["node_name"] == "VPS CI", config
          assert config["runtime_channel"] == "candidate", config
          assert config["token"] == "***", config
          print("VPS identity/config persistence test: SUCCESS")
          PY

      - name: Build Android V0.1 APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify stable Jade APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          SIGNATURE_OUTPUT="$($APKSIGNER verify --print-certs "$APK")"
          printf '%s\n' "$SIGNATURE_OUTPUT"
          ACTUAL="$(
            printf '%s\n' "$SIGNATURE_OUTPUT" \
              | sed -n 's/^.*certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr '[:upper:]' '[:lower:]'
          )"
          EXPECTED="0b74e3f3d627ebd7f53454caf8dca65312099de702171af8bfb3a674fd484992"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: stable Jade signing certificate mismatch."
            echo "Expected: $EXPECTED"
            echo "Actual  : $ACTUAL"
            exit 1
          fi
          echo "Stable Jade signature: SUCCESS"

      - name: Package V0.1 bundle
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/jade-v010-bundle"
          mkdir -p "$OUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT/Jade-Genesis-0.1.0.apk"
          cp node-agent/jade_node_agent.py "$OUT/Jade-Genesis-Node-Runtime-0.1.0.py"
          cat > "$OUT/README.txt" <<'EOF'
          Jade Genesis 0.1.0 — Cognitive Core foundation

          Included:
          - Android APK signed with the existing stable Jade development certificate
          - Node Runtime 0.1.0 for Windows/Linux/macOS

          Runtime 0.1.0 preserves an existing node_id, token, port and Ollama configuration.
          It adds asynchronous tasks, runtime/diagnostic status, PC/VPS identity and candidate/stable channel metadata.
          Automatic remote runtime installation is NOT enabled in this version.
          No arbitrary shell command endpoint is exposed.
          EOF
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - name: Store V0.1 source only after successful tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jade Genesis Builder"
          git config user.email "jade-genesis-builder@users.noreply.github.com"

          git add \
            android/app/build.gradle.kts \
            android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt \
            android/app/src/main/java/com/jadegenesis/mobile/model/Models.kt \
            android/app/src/main/java/com/jadegenesis/mobile/node/NodeManager.kt \
            android/app/src/main/java/com/jadegenesis/mobile/brain/BrainRouter.kt \
            android/app/src/main/java/com/jadegenesis/mobile/brain/LocalPCBrain.kt \
            android/app/src/main/java/com/jadegenesis/mobile/cognitive \
            android/app/src/main/java/com/jadegenesis/mobile/mesh \
            android/app/src/main/java/com/jadegenesis/mobile/diagnostics \
            android/app/src/main/java/com/jadegenesis/mobile/runtime \
            android/app/src/main/java/com/jadegenesis/mobile/selfmodel/SelfModelBuilder.kt \
            android/app/src/main/java/com/jadegenesis/mobile/core/JadeCore.kt \
            android/app/src/main/java/com/jadegenesis/mobile/ui/JadeViewModel.kt \
            android/app/src/main/java/com/jadegenesis/mobile/ui/JadeApp.kt \
            node-agent/jade_node_agent.py


          if git diff --cached --quiet; then
            echo "No V0.1 source changes to commit."
          else
            git commit -m "Jade Genesis Android 0.1.0 Cognitive Core [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload Jade Genesis V0.1 bundle
        uses: actions/upload-artifact@v4
        with:
          name: Jade-Genesis-0.1.0
          path: ${{ runner.temp }}/jade-v010-bundle/
          if-no-files-found: error
          retention-days: 90
