      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify 0.0.4 source and environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

          grep -q 'versionName = "0.0.4"' android/app/build.gradle.kts
          grep -q 'versionCode = 4' android/app/build.gradle.kts
          grep -q 'CURRENT_VERSION = "0.0.4"' android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt
          grep -q 'jade-genesis-node/0.0.4' android/app/src/main/java/com/jadegenesis/mobile/node/NodeManager.kt
          test -f android/app/src/main/java/com/jadegenesis/mobile/task/TaskRouter.kt
          grep -q 'genesis_probe' android/app/src/main/java/com/jadegenesis/mobile/task/TaskRouter.kt
          grep -q 'POST /task' node-agent/jade_node_agent.py
          python3 -m py_compile node-agent/jade_node_agent.py

      - name: Test PC Distributed Node Runtime
        shell: bash
        run: |
          set -euo pipefail

          export HOME="$RUNNER_TEMP/jade-node-test-home"
          mkdir -p "$HOME"

          python3 node-agent/jade_node_agent.py --port 18765 > "$RUNNER_TEMP/jade-node.log" 2>&1 &
          AGENT_PID=$!
          trap 'kill "$AGENT_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if [ -f "$HOME/.jade-genesis/node-agent.json" ]; then
              sleep 1
              break
            fi
            sleep 0.2
          done

          TOKEN="$(python3 - <<'PYTOKEN'
          import json
          from pathlib import Path
          p = Path.home() / '.jade-genesis' / 'node-agent.json'
          print(json.loads(p.read_text(encoding='utf-8'))['token'])
          PYTOKEN
          )"
          export TOKEN

          python3 - <<'PYTEST'
          import hashlib
          import json
          import os
          import urllib.request
          
          protocol = 'jade-genesis-node/0.0.4'
          token = os.environ['TOKEN']
          headers = {'X-Jade-Token': token, 'Accept': 'application/json'}
          
          req = urllib.request.Request('http://127.0.0.1:18765/health', headers=headers)
          with urllib.request.urlopen(req, timeout=4) as response:
              health = json.load(response)
          assert health['protocol'] == protocol
          assert 'task_execution_v1' in health['capabilities']
          assert 'genesis_probe' in health['capabilities']
          
          payload = 'jade-ci-probe'
          iterations = 250
          body = json.dumps({
              'protocol': protocol,
              'task_id': 'ci-task-004',
              'task_kind': 'genesis_probe',
              'payload': payload,
              'iterations': iterations,
          }).encode('utf-8')
          headers2 = dict(headers)
          headers2['Content-Type'] = 'application/json; charset=utf-8'
          req = urllib.request.Request(
              'http://127.0.0.1:18765/task',
              data=body,
              headers=headers2,
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=6) as response:
              task = json.load(response)
          
          expected = payload.encode('utf-8')
          for _ in range(iterations):
              expected = hashlib.sha256(expected).digest()
          assert task['success'] is True
          assert task['task_id'] == 'ci-task-004'
          assert task['result'] == expected.hex()
          print('Distributed Node Runtime self-test OK')
          PYTEST

          kill "$AGENT_PID" 2>/dev/null || true
          trap - EXIT
          cat "$RUNNER_TEMP/jade-node.log"

      - name: Build Jade APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:assembleDebug --stacktrace

      - name: Verify APK and stable signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: No APK generated"
            exit 1
          fi

          SIGNATURE_OUTPUT="$(
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
              verify \
              --print-certs \
              "$APK"
          )"
          echo "$SIGNATURE_OUTPUT"

          ACTUAL="$(
            printf '%s\n' "$SIGNATURE_OUTPUT" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr '[:upper:]' '[:lower:]'
          )"
          EXPECTED="0b74e3f3d627ebd7f53454caf8dca65312099de702171af8bfb3a674fd484992"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Unexpected APK signing certificate."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          echo "Stable Jade signing certificate verified."

      - name: Store Jade 0.0.4 source in repository
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Jade Genesis CI"
          git config user.email "actions@users.noreply.github.com"

          STORED=0
          for ATTEMPT in $(seq 1 8); do
            echo "Source publish attempt $ATTEMPT/8"
            git fetch origin main
            git reset --hard origin/main
            tar -xzf "$RUNNER_TEMP/jade-v004-source.tar.gz" -C "$GITHUB_WORKSPACE"
            git add android node-agent

            if git diff --cached --quiet; then
              echo "Jade 0.0.4 source is already committed."
              STORED=1
              break
            fi

            git commit -m "Jade Genesis 0.0.4 Distributed Runtime and Task Router [skip ci]"

            if git push origin HEAD:main; then
              STORED=1
              break
            fi

            echo "Concurrent workflow changed main; retrying with latest main."
            sleep 12
          done

          if [ "$STORED" -ne 1 ]; then
            echo "ERROR: Could not store Jade 0.0.4 source after retries."
            exit 1
          fi

      - name: Upload Jade Genesis 0.0.4 bundle
        uses: actions/upload-artifact@v4
        with:
          name: Jade-Genesis-0.0.4
          path: |
            android/app/build/outputs/apk/debug/*.apk
            node-agent/jade_node_agent.py
            node-agent/README.md
          if-no-files-found: error
