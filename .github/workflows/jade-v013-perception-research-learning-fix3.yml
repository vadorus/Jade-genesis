          )

          tool_anchor = '    fun proposeToolCandidate(idea: String) {\n'
          research_vm = '''    fun deepResearchLastVisualObservation() {
              viewModelScope.launch {
                  _state.value = _state.value.copy(
                      researchBusy = true,
