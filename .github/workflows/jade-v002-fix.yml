      - name: Store Jade 0.0.2 source and canonical workflow
        shell: bash
        run: |
          set -euo pipefail

          TEMP_WORKFLOW=".github/workflows/jade-v002-fix.yml"
          CANONICAL_WORKFLOW=".github/workflows/build-android.yml"
          OLD_TEMP_WORKFLOW=".github/workflows/jade-v002.yml"

          if [ -f "$TEMP_WORKFLOW" ]; then
            cp "$TEMP_WORKFLOW" "$CANONICAL_WORKFLOW"
          fi

          rm -f "$OLD_TEMP_WORKFLOW"
          rm -f "$TEMP_WORKFLOW"

          if [ -n "$(git status --porcelain -- android .github/workflows)" ]; then
            git config user.name "Jade Genesis CI"
            git config user.email "actions@users.noreply.github.com"

            git add android .github/workflows

            git commit \
              -m "Jade Genesis Android 0.0.2 Resource Governor and Brain Router [skip ci]"

            git push origin HEAD:main
          else
            echo "Jade 0.0.2 source and workflow are already committed."
          fi

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          find "$ANDROID_SDK_ROOT/platforms" \
            -maxdepth 2 \
            -name android.jar \
            -print

      - name: Build Jade APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            -p android \
            :app:assembleDebug \
            --stacktrace

      - name: Verify APK and signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find android/app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK generated"
            exit 1
          fi

          echo "===== Jade APK ====="
          echo "$APK"

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify \
            --print-certs \
            "$APK"

      - name: Upload Jade Genesis APK
        uses: actions/upload-artifact@v4
        with:
          name: Jade-Genesis-Android-0.0.2
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
