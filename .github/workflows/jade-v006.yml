      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify 0.0.6 source and environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

          grep -q 'versionName = "0.0.6"' android/app/build.gradle.kts
          grep -q 'versionCode = 6' android/app/build.gradle.kts
          grep -q 'CURRENT_VERSION = "0.0.6"' android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt
          grep -q 'jade-genesis-node/0.0.6' android/app/src/main/java/com/jadegenesis/mobile/node/NodeManager.kt
          grep -q 'task_execution_v3' android/app/src/main/java/com/jadegenesis/mobile/node/NodeManager.kt
          grep -q 'memory_consolidation' android/app/src/main/java/com/jadegenesis/mobile/task/TaskRouter.kt
          test -f android/app/src/main/java/com/jadegenesis/mobile/task/TaskQueue.kt
          grep -q 'PersistentTaskQueue 0.0.6' android/app/src/main/java/com/jadegenesis/mobile/selfmodel/SelfModelBuilder.kt
          grep -q 'memory_consolidation' node-agent/jade_node_agent.py
          python3 -m py_compile node-agent/jade_node_agent.py
          python3 node-agent/jade_node_agent.py --self-test

      - name: Test PC Memory Consolidation Node Runtime
        shell: bash
        run: |
          set -euo pipefail

          export HOME="$RUNNER_TEMP/jade-node-test-home"
          mkdir -p "$HOME"

          python3 node-agent/jade_node_agent.py --port 18766 > "$RUNNER_TEMP/jade-node.log" 2>&1 &
          AGENT_PID=$!
          trap 'kill "$AGENT_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 40); do
            if [ -f "$HOME/.jade-genesis/node-agent.json" ]; then
              sleep 1
              break
            fi
            sleep 0.2
          done

          TOKEN="$(python3 - <<'PYTOKEN'
          import json
          from pathlib import Path
          p = Path.home() / '.jade-genesis' / 'node-agent.json'
          print(json.loads(p.read_text(encoding='utf-8'))['token'])
          PYTOKEN
          )"
          export TOKEN

          python3 - <<'PYTEST'
          import hashlib
          import json
          import os
          import urllib.request

          protocol = 'jade-genesis-node/0.0.6'
          token = os.environ['TOKEN']
          headers = {
              'X-Jade-Token': token,
              'Accept': 'application/json',
          }

          req = urllib.request.Request(
              'http://127.0.0.1:18766/health',
              headers=headers,
          )
          with urllib.request.urlopen(req, timeout=4) as response:
              health = json.load(response)

          assert health['protocol'] == protocol
          assert 'task_execution_v3' in health['capabilities']
          assert 'memory_consolidation' in health['capabilities']

          memory_payload = json.dumps(
              {
                  'identity_id': 'JG-ci',
                  'memories': [
                      {
                          'id': '1',
                          'type': 'FACT',
                          'content': 'Jade utilise le PC.',
                          'source': 'USER',
                          'confidence': 1.0,
                          'created_at': 1,
                      },
                      {
                          'id': '2',
                          'type': 'FACT',
                          'content': 'Jade utilise le PC.',
                          'source': 'USER',
                          'confidence': 1.0,
                          'created_at': 2,
                      },
                      {
                          'id': '3',
                          'type': 'OBSERVATION',
                          'content': "Jade n'utilise pas le PC.",
                          'source': 'TEST',
                          'confidence': 0.8,
                          'created_at': 3,
                      },
                  ],
              },
              ensure_ascii=False,
              separators=(',', ':'),
          )

          body = json.dumps(
              {
                  'protocol': protocol,
                  'task_id': 'ci-memory-006',
                  'task_kind': 'memory_consolidation',
                  'payload': memory_payload,
                  'workload': 'MEDIUM',
                  'iterations': 0,
              },
              ensure_ascii=False,
          ).encode('utf-8')

          task_headers = dict(headers)
          task_headers['Content-Type'] = 'application/json; charset=utf-8'
          req = urllib.request.Request(
              'http://127.0.0.1:18766/task',
              data=body,
              headers=task_headers,
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=8) as response:
              task = json.load(response)

          assert task['success'] is True
          assert task['task_id'] == 'ci-memory-006'
          result = json.loads(task['result'])
          assert result['input_count'] == 3
          assert result['duplicate_groups'] == 1
          assert result['input_sha256'] == hashlib.sha256(
              memory_payload.encode('utf-8')
          ).hexdigest()
          print('Memory consolidation runtime HTTP self-test OK')
          PYTEST

          kill "$AGENT_PID" 2>/dev/null || true
          trap - EXIT
          cat "$RUNNER_TEMP/jade-node.log"

      - name: Build Jade APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:assembleDebug --stacktrace

      - name: Verify APK and stable signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: No APK generated"
            exit 1
          fi

          SIGNATURE_OUTPUT="$(
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
              verify \
              --print-certs \
              "$APK"
          )"
          echo "$SIGNATURE_OUTPUT"

          ACTUAL="$(
            printf '%s\n' "$SIGNATURE_OUTPUT" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr '[:upper:]' '[:lower:]'
          )"
          EXPECTED="0b74e3f3d627ebd7f53454caf8dca65312099de702171af8bfb3a674fd484992"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Unexpected APK signing certificate."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          cp "$APK" "$RUNNER_TEMP/Jade-Genesis-0.0.6.apk"
          echo "Stable Jade signing certificate verified."

      - name: Store Jade 0.0.6 source in repository
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Jade Genesis CI"
          git config user.email "actions@users.noreply.github.com"

          STORED=0
          for ATTEMPT in $(seq 1 8); do
            echo "Source publish attempt $ATTEMPT/8"
            git fetch origin main
            git reset --hard origin/main
            tar -xzf "$RUNNER_TEMP/jade-v006-source.tar.gz" -C "$GITHUB_WORKSPACE"
            git add android node-agent

            if git diff --cached --quiet; then
              echo "Jade 0.0.6 source is already committed."
              STORED=1
              break
            fi

            git commit -m "Jade Genesis 0.0.6 Memory Consolidation and Task Queue [skip ci]"

            if git push origin HEAD:main; then
              STORED=1
              break
            fi

            echo "Concurrent workflow changed main; retrying with latest main."
            sleep 12
          done

          if [ "$STORED" -ne 1 ]; then
            echo "ERROR: Could not store Jade 0.0.6 source after retries."
            exit 1
          fi

      - name: Package Jade Genesis 0.0.6 bundle
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="$RUNNER_TEMP/Jade-Genesis-0.0.6"
          mkdir -p "$BUNDLE"

          cp "$RUNNER_TEMP/Jade-Genesis-0.0.6.apk" "$BUNDLE/Jade-Genesis-0.0.6.apk"
          cp node-agent/jade_node_agent.py "$BUNDLE/Jade-Genesis-Node-Runtime-0.0.6.py"
          cp node-agent/README.md "$BUNDLE/PC-Node-Runtime-README.md"
          cp "$RUNNER_TEMP/jade-v006-source.tar.gz" "$BUNDLE/Jade-Genesis-0.0.6-source.tar.gz"

          cat > "$BUNDLE/BUILD-INFO.txt" <<'INFO'
          Jade Genesis 0.0.6
          Milestone: Memory Consolidation + Persistent Distributed Task Queue
          Android: versionCode 6 / versionName 0.0.6
          Node protocol: jade-genesis-node/0.0.6
          Allowed tasks: genesis_probe, text_analysis, memory_consolidation
          No arbitrary shell/system command execution.
          Stable Android signing certificate preserved.
          INFO
          sed -i 's/^          //' "$BUNDLE/BUILD-INFO.txt"

          (
            cd "$BUNDLE"
            sha256sum \
