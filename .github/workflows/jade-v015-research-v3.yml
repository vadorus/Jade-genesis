                  Spacer(Modifier.height(10.dp))
                  OutlinedButton(
                      onClick = { vm.lockAdmin() },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("Verrouiller le mode Admin")
                  }
              }
          }
          
