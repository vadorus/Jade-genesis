      - name: Verify V0.1.1 source and capabilities before build
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/build.gradle.kts
          test -f android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt
          test -f android/app/src/main/java/com/jadegenesis/mobile/model/Models.kt
          test -f android/app/src/main/java/com/jadegenesis/mobile/screen/ScreenCaptureService.kt
          test -f android/app/src/main/java/com/jadegenesis/mobile/screen/ScreenObserverRepository.kt
          test -f android/app/src/main/java/com/jadegenesis/mobile/tools/ToolLab.kt

          grep -F 'versionCode = 11' android/app/build.gradle.kts
          grep -F 'versionName = "0.1.1"' android/app/build.gradle.kts
          grep -F 'const val CURRENT_VERSION = "0.1.1"' \
            android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt
          grep -F 'val version: String = "0.1.1"' \
            android/app/src/main/java/com/jadegenesis/mobile/model/Models.kt
          grep -F 'class ScreenCaptureService' \
            android/app/src/main/java/com/jadegenesis/mobile/screen/ScreenCaptureService.kt
          grep -F 'class ToolLab' \
            android/app/src/main/java/com/jadegenesis/mobile/tools/ToolLab.kt
          grep -F 'node_registry_deduplicated' \
            android/app/src/main/java/com/jadegenesis/mobile/node/NodeManager.kt
          grep -F 'screen_analyze' node-agent/jade_node_agent.py
          grep -F 'vision_analyze' node-agent/jade_node_agent.py
          grep -F 'VERSION = "0.1.1"' node-agent/jade_node_agent.py

          if grep -Fq 'import androidx.compose.foundation.layout.weight' \
            android/app/src/main/java/com/jadegenesis/mobile/ui/JadeApp.kt; then
            echo "ERROR: obsolete Compose weight import returned."
            exit 1
          fi

          echo "Source V0.1.1 Screen Observer + Tool Lab confirmed."

      - name: Validate Node Runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile node-agent/jade_node_agent.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          runtime = Path("node-agent/jade_node_agent.py")
          spec = importlib.util.spec_from_file_location("jade_node_runtime", runtime)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          assert module.VERSION == "0.1.1"
          assert "screen_analyze" in module.ALLOWED_TASKS
          assert "vision_analyze" in module.ALLOWED_TASKS
          assert isinstance(module.screen_capture_supported(), bool)
          print("Runtime 0.1.1 smoke test OK")
          PY

      - name: Remove every stale Android build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android/.gradle
          rm -rf android/build
          rm -rf android/app/build

          if [ -e android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: stale APK still exists after cleanup."
            exit 1
          fi

          echo "Old Gradle state and APK outputs removed."

      - name: Build V0.1.1 from scratch with real Gradle
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail

          gradle --version

          gradle \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace \
            clean \
            :app:assembleDebug

      - name: Verify APK really is Jade Genesis 0.1.1
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          META="android/app/build/outputs/apk/debug/output-metadata.json"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          test -f "$APK"
          test -f "$META"
          test -x "$AAPT"

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("android/app/build/outputs/apk/debug/output-metadata.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          elements = data.get("elements") or []

          if len(elements) != 1:
              raise SystemExit(f"Unexpected APK metadata elements: {len(elements)}")

          item = elements[0]
          version_code = item.get("versionCode")
          version_name = item.get("versionName")

          print(f"output-metadata: versionCode={version_code}, versionName={version_name}")

          if version_code != 11:
              raise SystemExit(
                  f"ERROR: APK metadata versionCode is {version_code}, expected 11."
              )

          if version_name != "0.1.1":
              raise SystemExit(
                  f"ERROR: APK metadata versionName is {version_name}, expected 0.1.1."
              )
          PY

          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | head -n 1)"
          echo "$PACKAGE_LINE"

          printf '%s\n' "$PACKAGE_LINE" \
            | grep -F "package: name='com.jadegenesis.mobile'"

          printf '%s\n' "$PACKAGE_LINE" \
            | grep -F "versionCode='11'"

          printf '%s\n' "$PACKAGE_LINE" \
            | grep -F "versionName='0.1.1'"

          echo "APK manifest independently confirmed as Jade Genesis 0.1.1."

      - name: Verify stable Jade APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          EXPECTED="0B:74:E3:F3:D6:27:EB:D7:F5:34:54:CA:F8:DC:A6:53:12:09:9D:E7:02:17:1A:F8:BF:B3:A6:74:FD:48:49:92"

          test -x "$APKSIGNER"

          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY_OUTPUT"

          HEX="$(
            printf '%s\n' "$VERIFY_OUTPUT" \
              | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([0-9a-fA-F]+).*/\1/p' \
              | head -n 1
          )"

          if [ -z "$HEX" ]; then
            echo "ERROR: unable to read APK signer SHA-256 digest."
            exit 1
          fi

          ACTUAL="$(
            printf '%s' "$HEX" \
              | tr '[:lower:]' '[:upper:]' \
              | fold -w2 \
              | paste -sd: -
          )"

          echo "Expected signer: $EXPECTED"
          echo "Actual signer:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Jade stable signature mismatch."
            exit 1
          fi

          echo "Stable Jade signing key confirmed."

      - name: Package only the verified V0.1.1 APK and runtime
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="$RUNNER_TEMP/Jade-Genesis-0.1.1"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          cp "$APK" "$OUT/Jade-Genesis-0.1.1.apk"
          cp node-agent/jade_node_agent.py "$OUT/jade_node_agent.py"
          cat > "$OUT/README-RUNTIME-0.1.1.txt" <<'EOF'
          Jade Genesis Runtime 0.1.1
          - Screen Observer PC: capture locale a la demande, jamais une commande shell arbitraire distante.
          - Vision: necessite un modele Ollama compatible (ex. Gemma 3 4B ou autre modele vision reconnu).
          - Tool Lab: genere des candidats non actives; aucune execution automatique de code candidat.
          - Device Registry Android 2.1 fusionne les doublons ayant le meme Node ID.
          EOF

          (
            cd "$OUT"
            sha256sum Jade-Genesis-0.1.1.apk jade_node_agent.py README-RUNTIME-0.1.1.txt > SHA256SUMS.txt
          )

          echo "Verified bundle contents:"
          ls -lh "$OUT"
          cat "$OUT/SHA256SUMS.txt"

      - name: Stop tracking generated Android build files
        shell: bash
        run: |
          set -euo pipefail

          cat > .gitignore <<'EOF'
          # Jade Genesis - generated Android/Gradle files
          android/.gradle/
          android/build/
          android/app/build/
          android/local.properties

          # Python generated files
          __pycache__/
          *.pyc
          EOF

          git rm -r --cached --ignore-unmatch \
            android/.gradle \
            android/build \
            android/app/build \
            android/local.properties

          git add .gitignore
          git add android/app/build.gradle.kts
          git add android/app/src/main
          git add node-agent/jade_node_agent.py

          if git diff --cached --quiet; then
            echo "No generated files were tracked."
          else
            git config user.name "Jade Genesis Builder"
            git config user.email "jade-genesis-builder@users.noreply.github.com"
            git commit -m "Jade Genesis 0.1.1 Screen Observer Tool Lab stabilization [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload verified Jade Genesis 0.1.1
        uses: actions/upload-artifact@v4
        with:
          name: Jade-Genesis-0.1.1-screen-tools-verified
          path: ${{ runner.temp }}/Jade-Genesis-0.1.1/
          if-no-files-found: error
          retention-days: 90
