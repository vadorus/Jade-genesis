name: Build Jade Genesis Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37"
          sdkmanager "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Extract Android project
        run: |
          rm -rf jade-genesis-android-0.0.1
          unzip -o jade-genesis-android-0.0.1.zip

      - name: Patch Android project
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          project = Path("jade-genesis-android-0.0.1")
          app_gradle = project / "app" / "build.gradle.kts"
          root_gradle = project / "build.gradle.kts"

          text = app_gradle.read_text(encoding="utf-8")

          # Android 17 / API 37 pour les dépendances AndroidX récentes.
          text = re.sub(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 37',
              text,
              count=1
          )

          # On garde targetSdk 36 pour le moment.
          text = re.sub(
              r'targetSdk\s*=\s*\d+',
              'targetSdk = 36',
              text,
              count=1
          )

          # AGP 9 utilise Kotlin intégré.
          text = re.sub(
              r'(?m)^\s*id\("org\.jetbrains\.kotlin\.android"\)\s*\n?',
              '',
              text
          )

          # Ancienne configuration Kotlin incompatible avec AGP 9.
          text = re.sub(
              r'(?ms)^\s*kotlinOptions\s*\{\s*.*?^\s*\}\s*\n?',
              '',
              text
          )

          app_gradle.write_text(text, encoding="utf-8")

          # API 37 nécessite AGP 9.1.1 minimum.
          if root_gradle.exists():
              root_text = root_gradle.read_text(encoding="utf-8")

              root_text = re.sub(
                  r'(id\("com\.android\.application"\)\s+version\s+")[^"]+(")',
                  r'\g<1>9.1.1\2',
                  root_text
              )

              root_gradle.write_text(root_text, encoding="utf-8")

          print("===== app/build.gradle.kts =====")
          print(app_gradle.read_text(encoding="utf-8"))

          print("===== build.gradle.kts =====")
          print(root_gradle.read_text(encoding="utf-8"))
          PY

      - name: Build Android APK
        run: |
          gradle \
            -p jade-genesis-android-0.0.1 \
            :app:assembleDebug \
            --stacktrace

      - name: Upload Jade Genesis APK
        uses: actions/upload-artifact@v4
        with:
          name: Jade-Genesis-Android-0.0.1
          path: jade-genesis-android-0.0.1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
