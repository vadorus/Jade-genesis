name: Jade Node Windows CI

on:
  push:
    branches:
      - main
      - "jade/**"
    tags:
      - "jade-node-v*"
    paths:
      - "node-agent/**"
      - "windows-node/**"
      - ".github/workflows/jade-node-windows-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "node-agent/**"
      - "windows-node/**"
      - ".github/workflows/jade-node-windows-ci.yml"

permissions:
  contents: read

concurrency:
  group: jade-node-windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build single-file Windows executable
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Build dependency-free Node Runtime payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check "pyinstaller==6.11.1"
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --console `
            --name JadeNodeRuntime `
            --distpath windows-node/build/runtime `
            --workpath windows-node/build/pyinstaller-work `
            --specpath windows-node/build/pyinstaller-spec `
            --paths node-agent `
            node-agent/jade_node_agent.py

          $runtime = Resolve-Path "windows-node/build/runtime/JadeNodeRuntime.exe"
          $payload = "windows-node/JadeNode.Windows/Payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item $runtime "$payload/JadeNodeRuntime.exe" -Force
          $hash = (Get-FileHash -Algorithm SHA256 $runtime).Hash.ToLowerInvariant()
          @{
            schema_version = 1
            runtime_version = "0.1.9"
            sha256 = $hash
          } | ConvertTo-Json | Set-Content "$payload/runtime-manifest.json" -Encoding utf8NoBOM

      - name: Smoke-test packaged Node Runtime on loopback
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          $config = Join-Path $env:RUNNER_TEMP "jade-node-runtime-config"
          New-Item -ItemType Directory -Force -Path $config | Out-Null
          $env:JADE_GENESIS_CONFIG_DIR = $config
          $stdout = Join-Path $env:RUNNER_TEMP "jade-runtime.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "jade-runtime.stderr.log"
          $process = Start-Process `
            -FilePath "windows-node/build/runtime/JadeNodeRuntime.exe" `
            -ArgumentList @("--node-kind", "PC", "--bind-address", "127.0.0.1", "--port", "$port") `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          try {
            $configPath = Join-Path $config "node-agent.json"
            $health = $null
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              if ($process.HasExited) {
                throw "Packaged runtime exited early with code $($process.ExitCode)."
              }
              if (Test-Path $configPath) {
                $nodeConfig = Get-Content $configPath -Raw | ConvertFrom-Json
                try {
                  $health = Invoke-RestMethod `
                    -Uri "http://127.0.0.1:$port/health" `
                    -Headers @{ "X-Jade-Token" = $nodeConfig.token } `
                    -TimeoutSec 3
                  break
                } catch {
                  Start-Sleep -Milliseconds 500
                }
              } else {
                Start-Sleep -Milliseconds 500
              }
            }
            if ($null -eq $health) { throw "Packaged runtime health check timed out." }
            if ($health.protocol -ne "jade-genesis-node/0.0.6") { throw "Protocol mismatch." }
            if ($health.agent_version -ne "0.1.9") { throw "Runtime version mismatch." }
            if ($health.bind_address -ne "127.0.0.1") { throw "Explicit bind address was not advertised." }
            if ($health.node_id -notlike "pc-*") { throw "PC identity was not created." }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
          }

      - name: Test Jade Node core security gates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet run `
            --project windows-node/JadeNode.Core.Tests/JadeNode.Core.Tests.csproj `
            --configuration Release

      - name: Publish self-contained JadeNode.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish `
            windows-node/JadeNode.Windows/JadeNode.Windows.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output windows-node/build/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:ContinuousIntegrationBuild=true

          $exe = Resolve-Path "windows-node/build/publish/JadeNode.exe"
          $unexpected = Get-ChildItem "windows-node/build/publish" -File |
            Where-Object { $_.Name -ne "JadeNode.exe" }
          if ($unexpected) {
            throw "Publish is not single-file: $($unexpected.Name -join ', ')"
          }
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Embedded payload self-test failed." }

      - name: Package executable and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "windows-node/build/artifact"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "windows-node/build/publish/JadeNode.exe" "$package/JadeNode.exe"
          Copy-Item "windows-node/INSTALLATION.txt" "$package/INSTALLATION.txt"
          $hash = (Get-FileHash -Algorithm SHA256 "$package/JadeNode.exe").Hash.ToLowerInvariant()
          "$hash  JadeNode.exe" | Set-Content "$package/JadeNode.exe.sha256" -Encoding ascii
          Get-ChildItem $package | Format-Table Name, Length

      - name: Upload Windows executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jade-node-windows-${{ github.sha }}
          path: windows-node/build/artifact/*
          if-no-files-found: error
          retention-days: 14

      - name: Validate tagged release version
        if: startsWith(github.ref, 'refs/tags/jade-node-v')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          [xml]$project = Get-Content "windows-node/JadeNode.Windows/JadeNode.Windows.csproj"
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ($tag -ne "jade-node-v$version") {
            throw "Tag $tag does not match Jade Node version $version."
          }

  release:
    name: Publish explicit Jade Node tag
    if: startsWith(github.ref, 'refs/tags/jade-node-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jade-node-windows-${{ github.sha }}
          path: release

      - name: Publish tagged Jade Node release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            release/JadeNode.exe \
            release/JadeNode.exe.sha256 \
            release/INSTALLATION.txt \
            --title "Jade Node Windows ${tag#jade-node-v}" \
            --notes "Jade Node pour Windows : exécutable autonome, runtime PC supervisé, Tailscale uniquement et mise à jour SHA-256 depuis ce dépôt."
