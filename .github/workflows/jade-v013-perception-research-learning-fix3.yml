        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jade Genesis CI"
          git config user.email "actions@jade-genesis.local"
          git add \
            android/app/build.gradle.kts \
            android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt \
            android/app/src/main/java/com/jadegenesis/mobile/model/Models.kt \
