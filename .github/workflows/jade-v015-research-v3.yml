          JADE_V015_FILE_3

          cat > "android/app/src/main/java/com/jadegenesis/mobile/research/ResearchEngine.kt" <<'JADE_V015_FILE_4'
          package com.jadegenesis.mobile.research
          
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.nio.charset.StandardCharsets
          import java.util.Base64
          
          enum class ResearchTargetKind {
              GITHUB_REPOSITORY
          }
          
          data class ResearchTarget(
              val kind: ResearchTargetKind,
              val owner: String,
              val repository: String
          ) {
              val canonical: String
                  get() = "$owner/$repository"
          }
          
          data class ResearchEvidence(
              val provider: String,
