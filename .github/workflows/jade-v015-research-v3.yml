                      .sortedWith(
                          compareByDescending<GenesisNode> { "compute" in it.capabilities }
                              .thenByDescending { "task_execution_v3" in it.capabilities }
                              .thenByDescending { it.ramAvailableGb }
                              .thenByDescending { it.cpuCores }
