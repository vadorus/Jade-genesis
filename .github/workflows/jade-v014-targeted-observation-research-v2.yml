                                      screenCaptureLauncher.launch(
                                          projectionManager.createScreenCaptureIntent()
                                      )
                                  },
                                  requestArmedCapture = {
                                      val needsNotificationPermission =
                                          Build.VERSION.SDK_INT >= 33 &&
                                              ContextCompat.checkSelfPermission(
                                                  context,
                                                  Manifest.permission.POST_NOTIFICATIONS
                                              ) != PackageManager.PERMISSION_GRANTED
                                      if (needsNotificationPermission) {
                                          pendingArmedPermission = true
                                          notificationPermissionLauncher.launch(
                                              Manifest.permission.POST_NOTIFICATIONS
                                          )
                                      } else {
                                          captureMode = ScreenCaptureService.MODE_ARMED
                                          screenCaptureLauncher.launch(
                                              projectionManager.createScreenCaptureIntent()
                                          )
                                      }
                                  },
                                  openFocusCrop = {
                                      context.startActivity(
                                          Intent(context, FocusCropActivity::class.java)
                                      )
                                  },
                                  modifier = Modifier.padding(innerPadding)
          '''
          text = replace_required(text, home_call_old, home_call_new, "JadeApp home capture callbacks")
          
          signature_old = '''private fun JadeHome(
              state: JadeUiState,
              vm: JadeViewModel,
              requestPhoneScreenCapture: () -> Unit,
              modifier: Modifier = Modifier
          )'''
          signature_new = '''private fun JadeHome(
              state: JadeUiState,
              vm: JadeViewModel,
              requestImmediateCapture: () -> Unit,
              requestArmedCapture: () -> Unit,
              openFocusCrop: () -> Unit,
              modifier: Modifier = Modifier
          )'''
          text = replace_required(text, signature_old, signature_new, "JadeHome signature")
          
          card_start = '        InfoCard("Perception + Research v1") {'
          card_end = '\n\n        if (state.chatBusy) {'
          new_card = '''        InfoCard("Perception ciblée + Research v2") {
                      Text(
                          "Choisis comment Jade reçoit l'image. Rien n'est capturé en secret : le mode armé reste visible dans une notification Android."
                      )
                      Spacer(Modifier.height(8.dp))
                      Button(
                          onClick = requestImmediateCapture,
                          enabled = !state.screenBusy && !state.researchBusy,
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text(if (state.screenBusy) "Observation en cours…" else "Capturer + analyser maintenant")
                      }
                      Spacer(Modifier.height(6.dp))
                      OutlinedButton(
                          onClick = requestArmedCapture,
                          enabled = !state.screenBusy && !state.researchBusy,
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text(if (state.screenArmed) "Observation armée" else "Armer l'observation d'une autre appli")
                      }
                      Spacer(Modifier.height(6.dp))
                      OutlinedButton(
                          onClick = openFocusCrop,
                          enabled = !state.screenBusy && !state.researchBusy,
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text("Choisir une zone + donner une consigne")
                      }
                      Spacer(Modifier.height(6.dp))
                      Button(
                          onClick = { vm.analyzePreparedVisual() },
                          enabled = !state.screenBusy && !state.researchBusy,
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text("Analyser la dernière image ciblée")
                      }
                      Spacer(Modifier.height(6.dp))
                      OutlinedButton(
                          onClick = { vm.analyzePcScreen() },
                          enabled = !state.screenBusy && !state.researchBusy,
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text("Analyser l'écran du PC")
                      }
                      Spacer(Modifier.height(6.dp))
                      Text(
                          "Astuce : depuis n'importe quelle appli, tu peux aussi faire une capture Android puis Partager → Jade Genesis. Jade ouvre alors le cadrage avant l'analyse."
                      )
                      if (state.screenMessage.isNotBlank()) {
                          Spacer(Modifier.height(8.dp))
                          Text(state.screenMessage)
                          Spacer(Modifier.height(8.dp))
                          Button(
                              onClick = { vm.deepResearchLastVisualObservation() },
                              enabled = !state.screenBusy && !state.researchBusy,
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Text(
                                  if (state.researchBusy) {
                                      "Recherche + vérification en cours…"
                                  } else {
                                      "Approfondir avec des données publiques"
                                  }
                              )
                          }
                          Spacer(Modifier.height(4.dp))
                          Text(
                              "L'image reste dans Jade/son nœud vision. Research v2 reçoit uniquement des requêtes texte ciblées et filtrées."
                          )
                      }
                      if (state.researchMessage.isNotBlank()) {
                          Spacer(Modifier.height(8.dp))
                          Text(state.researchMessage)
                      }
                  }'''
          text = replace_range(text, card_start, card_end, new_card, "JadeApp targeted perception card")
          write(app_path, text)
          
          # ------------------------------------------------------------------
          # Self model and local-node advertised capabilities.
          # ------------------------------------------------------------------
          self_path = "android/app/src/main/java/com/jadegenesis/mobile/selfmodel/SelfModelBuilder.kt"
          text = read(self_path)
          text = text.replace("CognitiveCore 0.1.3", "CognitiveCore 0.1.4")
          text = text.replace("DiagnosticLogger 0.1.3", "DiagnosticLogger 0.1.4")
          text = text.replace("LearningEngine + VisualLearning v1", "LearningEngine + VisualLearning v2 targeted")
          text = text.replace("ResearchEngine v1 public-data", "ResearchEngine v2 targeted-planner")
          text = text.replace(
              "Après une observation visuelle, Jade peut rechercher des données publiques via des fournisseurs interchangeables. V1 utilise Wikipedia, Wikidata et GitHub pour les sujets techniques.",
              "Research v2 extrait 1 à 3 requêtes ciblées depuis la consigne utilisateur et les éléments visuels à fort signal, puis recoupe Wikipedia, Wikidata, DuckDuckGo et GitHub pour les sujets techniques."
          )
          text = text.replace("VisualLearningStore v1", "VisualLearningStore v2")
          text = text.replace(
              "Jade conserve la provenance d'une observation, son empreinte d'image, la recherche associée et le niveau de corroboration avant consolidation.",
              "Jade conserve la provenance, l'empreinte, la consigne de ciblage, la recherche associée et le niveau de corroboration avant consolidation."
          )
          text = text.replace("ScreenObserver_v1_1_grounded", "ScreenObserver_v1_2_targeted")
          text = text.replace(
              "Le Pixel attend la disparition de l'overlay MediaProjection avant capture et demande une analyse factuelle en français. Le runtime PC 0.1.1 reste compatible.",
              "Le Pixel propose capture immédiate, observation armée par notification et images partagées. Une zone peut être cadrée et accompagnée d'une consigne avant l'analyse. Le runtime PC 0.1.1 reste compatible."
          )
          text = text.replace("Le Cognitive Core 0.1.1 orchestre", "Le Cognitive Core 0.1.4 orchestre")
          write(self_path, text)
          
          node_path = "android/app/src/main/java/com/jadegenesis/mobile/node/NodeManager.kt"
          text = read(node_path)
          text = replace_required(
              text,
              '            "research_engine_v1",\n            "visual_learning_v1"\n        ),\n        lastSeenAt = System.currentTimeMillis(),\n        runtimeVersion = "0.1.3",',
              '            "research_engine_v1",\n            "visual_learning_v1",\n            "research_engine_v2",\n            "visual_learning_v2",\n            "screen_targeting_v1",\n            "shared_image_input_v1"\n        ),\n        lastSeenAt = System.currentTimeMillis(),\n        runtimeVersion = "0.1.4",',
              "NodeManager V0.1.4 capabilities"
          )
          write(node_path, text)
          
          print("V0.1.4 targeted observation patch applied successfully")
          PY
          python3 "$RUNNER_TEMP/apply_v014.py"

      - name: Verify V0.1.4 source before build
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 14' android/app/build.gradle.kts
          grep -F 'versionName = "0.1.4"' android/app/build.gradle.kts
          grep -F 'CURRENT_VERSION = "0.1.4"' android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt
          grep -F 'MODE_ARMED' android/app/src/main/java/com/jadegenesis/mobile/screen/ScreenCaptureService.kt
          grep -F 'class FocusCropActivity' android/app/src/main/java/com/jadegenesis/mobile/screen/FocusCropActivity.kt
          grep -F 'android.intent.action.SEND' android/app/src/main/AndroidManifest.xml
          grep -F 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -F 'buildResearchQueries' android/app/src/main/java/com/jadegenesis/mobile/research/ResearchEngine.kt
          grep -F 'DuckDuckGo' android/app/src/main/java/com/jadegenesis/mobile/research/ResearchEngine.kt
          grep -F 'focusInstruction' android/app/src/main/java/com/jadegenesis/mobile/cognitive/VisualLearningStore.kt
          grep -F 'Analyser la dernière image ciblée' android/app/src/main/java/com/jadegenesis/mobile/ui/JadeApp.kt
          grep -F "Armer l'observation d'une autre appli" android/app/src/main/java/com/jadegenesis/mobile/ui/JadeApp.kt
          grep -F 'ResearchEngine v2 targeted-planner' android/app/src/main/java/com/jadegenesis/mobile/selfmodel/SelfModelBuilder.kt
          grep -F 'runtimeVersion = "0.1.4"' android/app/src/main/java/com/jadegenesis/mobile/node/NodeManager.kt
          grep -F 'type = MemoryType.HYPOTHESIS' android/app/src/main/java/com/jadegenesis/mobile/core/JadeCore.kt
          if grep -F 'RESEARCH_CANDIDATE_V2' android/app/src/main/java/com/jadegenesis/mobile/core/JadeCore.kt | grep -F 'MemoryType.KNOWLEDGE' >/dev/null; then
            echo "ERROR: visual web research must not auto-promote to stable KNOWLEDGE."
            exit 1
          fi
          grep -F 'VERSION = "0.1.1"' node-agent/jade_node_agent.py
          python3 -m py_compile node-agent/jade_node_agent.py

      - name: Remove every stale Android build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/.gradle android/build android/app/build
          find android -type f -name '*.apk' -delete

      - name: Build V0.1.4 from scratch with real Gradle
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            -p android \
            :app:assembleDebug

      - name: Verify APK really is Jade Genesis 0.1.4
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.jadegenesis.mobile'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionCode='14'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionName='0.1.4'" "$RUNNER_TEMP/badging.txt"
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk.sha256"

      - name: Verify stable Jade APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SIGNATURE_FILE="$RUNNER_TEMP/signature.txt"
          EXPECTED_DIGEST="0b74e3f3d627ebd7f53454caf8dca65312099de702171af8bfb3a674fd484992"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$SIGNATURE_FILE"
          grep -F "Number of signers: 1" "$SIGNATURE_FILE" >/dev/null
          ACTUAL_DIGEST="$(sed -n 's/^Signer #1 certificate SHA-256 digest:[[:space:]]*//p' "$SIGNATURE_FILE" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if [ -z "$ACTUAL_DIGEST" ] || [ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "ERROR: APK signer fingerprint does not match the stable Jade key."
            exit 1
          fi
          echo "Stable Jade signing fingerprint verified."

      - name: Package verified V0.1.4 APK and compatible runtime
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/jade-v014"
          mkdir -p "$OUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT/Jade-Genesis-0.1.4.apk"
          cp node-agent/jade_node_agent.py "$OUT/jade_node_agent_0.1.1.py"
          cp "$RUNNER_TEMP/apk.sha256" "$OUT/Jade-Genesis-0.1.4.apk.sha256.txt"
          cat > "$OUT/README.txt" <<'TXT'
          Jade Genesis 0.1.4 — Targeted Observation + Research Planner v2
          
          Android observation:
          - Immediate capture remains available.
          - Armed observation keeps MediaProjection visible and waits for the user to tap the Jade notification.
          - After an armed capture, Jade offers a crop/focus screen instead of forcing a one-second app switch.
          - Android screenshots/images can be shared directly to Jade Genesis through the system Share sheet.
          - The user can drag a region and add a textual instruction before visual analysis.
          - No hidden persistent screen recording is added.
          
          Research:
          - Research Planner v2 derives short targeted queries from the user focus and high-signal visible facts.
          - Public providers: French Wikipedia, Wikidata, DuckDuckGo Instant Answer and GitHub issues for technical topics.
          - The public Internet receives text queries only; the screenshot itself remains inside Jade/private vision routing.
          - Research findings remain HYPOTHESIS candidates until later validation/consolidation.
          
          Distributed runtime:
          - PC/VPS Node Runtime 0.1.1 remains compatible; no token or Node ID reset is needed.
          TXT

      - name: Persist verified V0.1.4 sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jade Genesis CI"
          git config user.email "actions@jade-genesis.local"
          git add \
            android/app/build.gradle.kts \
            android/app/src/main/AndroidManifest.xml \
