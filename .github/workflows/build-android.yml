name: Build Jade Genesis Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: >-
            platform-tools
            platforms;android-CinnamonBun
            build-tools;37.0.0

      - name: Prepare Android 17 SDK
        run: |
          echo "===== Installed Android platforms ====="
          ls -la "$ANDROID_SDK_ROOT/platforms"

          if [ -d "$ANDROID_SDK_ROOT/platforms/android-CinnamonBun" ]; then
            echo "Android 17 CinnamonBun SDK found"
          else
            echo "ERROR: Android CinnamonBun SDK not found"
            exit 1
          fi

          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s \
              "$ANDROID_SDK_ROOT/platforms/android-CinnamonBun" \
              "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

          echo "===== Android 37 platform ====="
          ls -la "$ANDROID_SDK_ROOT/platforms/android-37"

          if [ ! -f "$ANDROID_SDK_ROOT/platforms/android-37/android.jar" ]; then
            echo "ERROR: android.jar for API 37 not found"
            exit 1
          fi

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Extract Android project
        run: |
          rm -rf jade-genesis-android-0.0.1
          unzip -o jade-genesis-android-0.0.1.zip

      - name: Patch Android project
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          project = Path("jade-genesis-android-0.0.1")
          app_gradle = project / "app" / "build.gradle.kts"

          if not app_gradle.exists():
              raise SystemExit(
                  "ERROR: app/build.gradle.kts not found"
              )

          text = app_gradle.read_text(encoding="utf-8")

          # Android 17 / API 37
          text = re.sub(
              r'compileSdk\s*=\s*[0-9]+',
              'compileSdk = 37',
              text,
              count=1
          )

          # On conserve targetSdk 36 pour cette V0.1.
          text = re.sub(
              r'targetSdk\s*=\s*[0-9]+',
              'targetSdk = 36',
              text,
              count=1
          )

          # AGP 9 intègre Kotlin.
          text = re.sub(
              r'(?m)^\s*id"org\.jetbrains\.kotlin\.android"\s*\n?',
              '',
              text
          )

          # Suppression de l'ancienne configuration Kotlin.
          text = re.sub(
              r'(?ms)^\s*kotlinOptions\s*\{\s*.*?^\s*\}\s*\n?',
              '',
              text
          )

          app_gradle.write_text(
              text,
              encoding="utf-8"
          )

          print("===== Final app/build.gradle.kts =====")
          print(text)
          PY

      - name: Verify build environment
        run: |
          echo "===== Java ====="
          java -version

          echo "===== Gradle ====="
          gradle --version

          echo "===== Android SDK ====="
          echo "$ANDROID_SDK_ROOT"

          echo "===== Platforms ====="
          ls -la "$ANDROID_SDK_ROOT/platforms"

          echo "===== Build Tools ====="
          ls -la "$ANDROID_SDK_ROOT/build-tools"

      - name: Build Android APK
        run: |
          gradle \
            -p jade-genesis-android-0.0.1 \
            :app:assembleDebug \
            --stacktrace

      - name: Verify APK
        run: |
