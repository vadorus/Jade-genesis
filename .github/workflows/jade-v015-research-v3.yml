name: Jade V0.1.5 Research v3 Entity Router

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/jade-v015-research-v3.yml"

permissions:
  contents: write

jobs:
  diagnostic-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up real Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37 and Build Tools 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Restore stable Jade signing key
        shell: bash
        env:
          JADE_SIGNING_BUNDLE_B64: ${{ secrets.JADE_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${JADE_SIGNING_BUNDLE_B64:-}" ]; then
            echo "ERROR: GitHub secret JADE_SIGNING_BUNDLE_B64 is missing."
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/jade-signing"
          mkdir -p "$SIGN_DIR"

          printf '%s' "$JADE_SIGNING_BUNDLE_B64" | base64 -d > "$SIGN_DIR/signing.tar.gz"
          tar -xzf "$SIGN_DIR/signing.tar.gz" -C "$SIGN_DIR"

          test -f "$SIGN_DIR/jade-genesis-dev.jks"
          test -f "$SIGN_DIR/password.txt"
          test -f "$SIGN_DIR/alias.txt"

          PASSWORD="$(cat "$SIGN_DIR/password.txt")"
          ALIAS="$(cat "$SIGN_DIR/alias.txt")"

          echo "::add-mask::$PASSWORD"
          echo "JADE_KEYSTORE_PATH=$SIGN_DIR/jade-genesis-dev.jks" >> "$GITHUB_ENV"
          echo "JADE_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "JADE_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Extract exact V0.1.4 source scripts
        shell: bash
        run: |
          set -euo pipefail

          TARGET=".github/workflows/jade-v014-targeted-observation-research-v2.yml"
          test -f "$TARGET"

          python3 <<'PY'
          from pathlib import Path

          target = Path(".github/workflows/jade-v014-targeted-observation-research-v2.yml")
          lines = target.read_text(encoding="utf-8").splitlines(True)

          def extract_run(step_name: str, output: str) -> None:
              name_index = None
              expected = f"- name: {step_name}"

              for i, line in enumerate(lines):
                  if line.strip() == expected:
                      name_index = i
                      break

              if name_index is None:
                  raise SystemExit(f"ERROR: step not found: {step_name}")

              run_index = None
              run_indent = None

              for i in range(name_index + 1, len(lines)):
                  stripped = lines[i].lstrip(" ")
                  indent = len(lines[i]) - len(stripped)

                  if stripped.startswith("- name:") and indent <= 6:
                      break

                  if stripped.rstrip("\r\n") == "run: |":
                      run_index = i
                      run_indent = indent
                      break

              if run_index is None or run_indent is None:
                  raise SystemExit(f"ERROR: run block not found: {step_name}")

              script_indent = run_indent + 2
              out = []

              for i in range(run_index + 1, len(lines)):
                  line = lines[i]

                  if line.strip() == "":
                      out.append("\n")
                      continue

                  stripped = line.lstrip(" ")
                  indent = len(line) - len(stripped)

                  if indent <= run_indent:
                      break

                  out.append(line[script_indent:])

              if not out:
                  raise SystemExit(f"ERROR: empty run block: {step_name}")

              Path(output).write_text("".join(out), encoding="utf-8")
              print(f"Extracted {step_name} -> {output} ({len(out)} lines)")

          extract_run(
              "Add targeted observation, image sharing and Research v2",
              "/tmp/jade-v014-features.sh",
          )
          extract_run(
              "Patch Jade Core, UI and version to V0.1.4",
              "/tmp/jade-v014-core-version.sh",
          )
          extract_run(
              "Verify V0.1.4 source before build",
              "/tmp/jade-v014-source-verify.sh",
          )
          extract_run(
              "Remove every stale Android build",
              "/tmp/jade-v014-clean.sh",
          )
          PY

          chmod +x \
            /tmp/jade-v014-features.sh \
            /tmp/jade-v014-core-version.sh \
            /tmp/jade-v014-source-verify.sh \
            /tmp/jade-v014-clean.sh

          grep -F 'class ScreenObserverRepository' /tmp/jade-v014-features.sh >/dev/null
          grep -F 'versionCode = 14' /tmp/jade-v014-core-version.sh >/dev/null
          grep -F 'versionCode = 14' /tmp/jade-v014-source-verify.sh >/dev/null
          grep -F 'rm -rf android/.gradle android/build android/app/build' /tmp/jade-v014-clean.sh >/dev/null

      - name: Apply V0.1.4 targeted observation and Research v2
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/jade-v014-features.sh

      - name: Apply V0.1.4 Core UI and version patch
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/jade-v014-core-version.sh

      - name: Fix FocusCropActivity Toast context
        shell: bash
        run: |
          set -euo pipefail

          FILE="android/app/src/main/java/com/jadegenesis/mobile/screen/FocusCropActivity.kt"
          test -f "$FILE"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/java/com/jadegenesis/mobile/screen/FocusCropActivity.kt")
          text = path.read_text(encoding="utf-8")

          success_pattern = re.compile(
              r'Toast\.makeText\(\s*this,\s*'
              r'"Zone prête\. Dans Jade, touche « Analyser l\'image ciblée »\.",'
          )
          failure_pattern = re.compile(
              r'Toast\.makeText\(\s*this,\s*'
              r'error\.message \?: "Impossible de préparer cette zone\.",'
          )

          text, success_count = success_pattern.subn(
              'Toast.makeText(\n'
              '                                  this@FocusCropActivity,\n'
              '                                  "Zone prête. Dans Jade, touche « Analyser l\'image ciblée ».",',
              text,
              count=1,
          )
          text, failure_count = failure_pattern.subn(
              'Toast.makeText(\n'
              '                                  this@FocusCropActivity,\n'
              '                                  error.message ?: "Impossible de préparer cette zone.",',
              text,
              count=1,
          )

          if success_count != 1 or failure_count != 1:
              raise SystemExit(
                  "ERROR: expected exactly one success Toast and one failure Toast; "
                  f"got success={success_count}, failure={failure_count}"
              )

          path.write_text(text, encoding="utf-8")
          print("Fixed both nested Toast contexts in FocusCropActivity.kt")
          PY

          COUNT="$(grep -cF 'this@FocusCropActivity' "$FILE")"
          if [ "$COUNT" -ne 2 ]; then
            echo "ERROR: expected exactly 2 this@FocusCropActivity markers, got $COUNT"
            exit 1
          fi

          grep -F 'Zone prête. Dans Jade, touche « Analyser l'"'"'image ciblée ».' "$FILE" >/dev/null
          grep -F 'error.message ?: "Impossible de préparer cette zone."' "$FILE" >/dev/null

          echo "FocusCropActivity Toast context fix verified."

      - name: Show critical V0.1.4 version markers
        shell: bash
        run: |
          set -euo pipefail

          echo "=== build.gradle.kts version markers ==="
          grep -nE 'versionCode|versionName' android/app/build.gradle.kts

          echo "=== IdentityManager CURRENT_VERSION ==="
          grep -nF 'CURRENT_VERSION' \
            android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt

          echo "=== NodeManager runtimeVersion ==="
          grep -nF 'runtimeVersion' \
            android/app/src/main/java/com/jadegenesis/mobile/node/NodeManager.kt

      - name: Verify exact V0.1.4 generated sources
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/jade-v014-source-verify.sh

      - name: Apply complete V0.1.5 Research v3 candidate files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/app/src/test/java/com/jadegenesis/mobile/research

          cat > "android/app/build.gradle.kts" <<'JADE_V015_FILE_1'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }
          
          val jadeKeystorePath = System.getenv("JADE_KEYSTORE_PATH")
          val jadeKeystorePassword = System.getenv("JADE_KEYSTORE_PASSWORD")
          val jadeKeyAlias = System.getenv("JADE_KEY_ALIAS") ?: "jadegenesis"
          
          android {
              namespace = "com.jadegenesis.mobile"
              compileSdk = 37
          
              defaultConfig {
                  applicationId = "com.jadegenesis.mobile"
                  minSdk = 31
                  targetSdk = 37
                  versionCode = 15
                  versionName = "0.1.5"
              }
          
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          
              signingConfigs {
                  if (
                      !jadeKeystorePath.isNullOrBlank() &&
                      !jadeKeystorePassword.isNullOrBlank()
                  ) {
                      create("jadeDev") {
                          storeFile = file(jadeKeystorePath)
                          storePassword = jadeKeystorePassword
                          keyAlias = jadeKeyAlias
                          keyPassword = jadeKeystorePassword
                      }
                  }
              }
          
              buildTypes {
                  getByName("debug") {
                      signingConfigs.findByName("jadeDev")?.let {
                          signingConfig = it
                      }
                  }
              }
          
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }
          
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2026.08.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)
          
              implementation("androidx.core:core-ktx:1.19.0")
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.11.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0")
          
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              debugImplementation("androidx.compose.ui:ui-tooling")
          
              implementation("androidx.datastore:datastore-preferences:1.2.1")
          
              val roomVersion = "3.0.2"
              implementation("androidx.room3:room3-runtime:$roomVersion")
              ksp("androidx.room3:room3-compiler:$roomVersion")
          
              testImplementation("junit:junit:4.13.2")
          }
          JADE_V015_FILE_1

          cat > "android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt" <<'JADE_V015_FILE_2'
          package com.jadegenesis.mobile.identity
          
          import android.content.Context
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.longPreferencesKey
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import com.jadegenesis.mobile.model.JadeIdentity
          import kotlinx.coroutines.flow.first
          import java.util.UUID
          
          private val Context.identityDataStore by preferencesDataStore(name = "jade_identity")
          
          class IdentityManager(private val context: Context) {
          
              private object Keys {
                  val ID = stringPreferencesKey("jade_id")
                  val NAME = stringPreferencesKey("jade_name")
                  val VERSION = stringPreferencesKey("jade_version")
                  val CREATED_AT = longPreferencesKey("jade_created_at")
              }
          
              private companion object {
                  const val CURRENT_VERSION = "0.1.5"
              }
          
              suspend fun loadOrCreate(): JadeIdentity {
                  val current = context.identityDataStore.data.first()
                  val existingId = current[Keys.ID]
          
                  if (existingId != null) {
                      val identity = JadeIdentity(
                          jadeId = existingId,
                          name = current[Keys.NAME] ?: "Jade Genesis",
                          version = CURRENT_VERSION,
                          createdAt = current[Keys.CREATED_AT] ?: System.currentTimeMillis()
                      )
          
                      if (current[Keys.VERSION] != CURRENT_VERSION) {
                          context.identityDataStore.edit { prefs ->
                              prefs[Keys.VERSION] = CURRENT_VERSION
                          }
                      }
          
                      return identity
                  }
          
                  val identity = JadeIdentity(
                      jadeId = "JG-${UUID.randomUUID()}",
                      version = CURRENT_VERSION,
                      createdAt = System.currentTimeMillis()
                  )
          
                  context.identityDataStore.edit { prefs ->
                      prefs[Keys.ID] = identity.jadeId
                      prefs[Keys.NAME] = identity.name
                      prefs[Keys.VERSION] = identity.version
                      prefs[Keys.CREATED_AT] = identity.createdAt
                  }
          
                  return identity
              }
          }
          JADE_V015_FILE_2

          cat > "android/app/src/main/java/com/jadegenesis/mobile/model/Models.kt" <<'JADE_V015_FILE_3'
          package com.jadegenesis.mobile.model
          
          enum class MemoryType {
              FACT,
              OBSERVATION,
