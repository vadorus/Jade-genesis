name: Build Jade Genesis Android V0.0.7 Memory Lifecycle FINAL

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/jade-v007-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android API 37.0
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Restore stable Jade signing key
        shell: bash
        env:
          JADE_SIGNING_BUNDLE_B64: ${{ secrets.JADE_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${JADE_SIGNING_BUNDLE_B64:-}" ]; then
            echo "ERROR: GitHub secret JADE_SIGNING_BUNDLE_B64 is missing."
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/jade-signing"
          mkdir -p "$SIGN_DIR"
          printf '%s' "$JADE_SIGNING_BUNDLE_B64" | base64 -d > "$SIGN_DIR/signing.tar.gz"
          tar -xzf "$SIGN_DIR/signing.tar.gz" -C "$SIGN_DIR"

          test -f "$SIGN_DIR/jade-genesis-dev.jks"
          test -f "$SIGN_DIR/password.txt"
          test -f "$SIGN_DIR/alias.txt"

          PASSWORD="$(cat "$SIGN_DIR/password.txt")"
          ALIAS="$(cat "$SIGN_DIR/alias.txt")"
          echo "::add-mask::$PASSWORD"

          echo "JADE_KEYSTORE_PATH=$SIGN_DIR/jade-genesis-dev.jks" >> "$GITHUB_ENV"
          echo "JADE_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "JADE_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Apply Jade Genesis 0.0.7 source
        shell: bash
        run: |
          set -euo pipefail

          cat > android/app/src/main/java/com/jadegenesis/mobile/memory/MemoryLifecycleManager.kt <<'KOTLIN'
          package com.jadegenesis.mobile.memory
          
          import android.content.Context
          import com.jadegenesis.mobile.model.MemorySnapshot
          import java.security.MessageDigest
          
          enum class MemoryLifecycleState {
              NEW,
              CONFIRMED,
              CONTRADICTORY,
              OBSOLETE_CANDIDATE,
              STABLE
          }
          
          data class MemoryLifecycleAnalysis(
              val sourceCount: Int,
              val newCount: Int,
              val confirmedCount: Int,
              val confirmationGroups: Int,
              val contradictionCount: Int,
              val obsoleteCandidateCount: Int,
              val sourceFingerprint: String,
              val lastConsolidatedFingerprint: String?,
              val lastConsolidatedAt: Long,
              val needsConsolidation: Boolean,
              val reason: String,
              val sourceIds: Set<String>
          )
          
          class MemoryLifecycleManager(context: Context) {
              private val prefs = context.getSharedPreferences(
                  "jade_genesis_memory_lifecycle",
                  Context.MODE_PRIVATE
              )
          
              companion object {
                  private const val KEY_LAST_FINGERPRINT = "last_source_fingerprint_v1"
                  private const val KEY_LAST_SOURCE_IDS = "last_source_ids_v1"
                  private const val KEY_LAST_CONSOLIDATED_AT = "last_consolidated_at_v1"
                  private const val KEY_LAST_KNOWLEDGE_ID = "last_knowledge_id_v1"
                  private const val KEY_LAST_RESULT_SHA256 = "last_result_sha256_v1"
          
                  private val STOP_WORDS = setOf(
                      "le", "la", "les", "un", "une", "des", "de", "du",
                      "et", "ou", "a", "à", "au", "aux", "en", "dans",
                      "sur", "pour", "par", "avec", "que", "qui", "je",
                      "tu", "il", "elle", "nous", "vous", "ils", "elles",
                      "mon", "ma", "mes", "ton", "ta", "tes", "son", "sa",
                      "ses", "ce", "cet", "cette", "ces", "est", "sont",
                      "être", "etre", "ai", "as", "avons", "avez", "ont"
                  )
          
                  private val NEGATION_WORDS = setOf(
                      "ne", "n", "pas", "jamais", "aucun", "aucune",
                      "non", "plus", "sans"
                  )
              }
          
              fun sourceMemories(
                  memories: List<MemorySnapshot>,
                  limit: Int = 24
              ): List<MemorySnapshot> = memories
                  .filterNot { it.source.startsWith("JADE_CONSOLIDATION_") }
                  .take(limit.coerceAtLeast(1))
          
              fun analyze(memories: List<MemorySnapshot>): MemoryLifecycleAnalysis {
                  val sources = sourceMemories(memories)
                  val sourceIds = sources.map { it.id }.toSet()
                  val previousIds = prefs
                      .getStringSet(KEY_LAST_SOURCE_IDS, emptySet())
                      .orEmpty()
                      .toSet()
                  val lastFingerprint = prefs
                      .getString(KEY_LAST_FINGERPRINT, null)
                      ?.takeIf { it.isNotBlank() }
                  val lastAt = prefs.getLong(KEY_LAST_CONSOLIDATED_AT, 0L)
          
                  val duplicateGroups = sources
                      .groupBy { normalize(it.content) }
                      .filterKeys { it.isNotBlank() }
                      .values
                      .filter { it.size > 1 }
                  val confirmedIds = duplicateGroups
                      .flatten()
                      .map { it.id }
                      .toSet()
          
                  val contradictionPairs = findContradictions(sources)
                  val obsoleteIds = contradictionPairs
                      .map { pair ->
                          if (pair.first.createdAt <= pair.second.createdAt) {
                              pair.first.id
                          } else {
                              pair.second.id
                          }
                      }
                      .toSet()
          
                  val newIds = sourceIds - previousIds
                  val fingerprint = sourceFingerprint(sources)
                  val needsConsolidation =
                      sources.isNotEmpty() && fingerprint != lastFingerprint
          
                  val reason = when {
                      sources.isEmpty() ->
                          "Aucune mémoire source à consolider."
                      lastFingerprint == null ->
                          "Premier cycle Memory Lifecycle 0.0.7 : création d'une empreinte de référence."
                      !needsConsolidation ->
                          "Aucun changement de source depuis la dernière consolidation : nouvelle connaissance inutile."
                      else -> buildString {
                          append("Le lot mémoire a changé")
                          if (newIds.isNotEmpty()) {
                              append(" : ${newIds.size} nouvelle(s) mémoire(s)")
                          }
                          append(". Une consolidation est utile.")
                      }
                  }
          
                  return MemoryLifecycleAnalysis(
                      sourceCount = sources.size,
                      newCount = newIds.size,
                      confirmedCount = confirmedIds.size,
                      confirmationGroups = duplicateGroups.size,
                      contradictionCount = contradictionPairs.size,
                      obsoleteCandidateCount = obsoleteIds.size,
                      sourceFingerprint = fingerprint,
                      lastConsolidatedFingerprint = lastFingerprint,
                      lastConsolidatedAt = lastAt,
                      needsConsolidation = needsConsolidation,
                      reason = reason,
                      sourceIds = sourceIds
                  )
              }
          
              fun markConsolidated(
                  analysis: MemoryLifecycleAnalysis,
                  knowledgeId: String,
                  resultSha256: String
              ) {
                  prefs.edit()
                      .putString(KEY_LAST_FINGERPRINT, analysis.sourceFingerprint)
                      .putStringSet(KEY_LAST_SOURCE_IDS, analysis.sourceIds)
                      .putLong(KEY_LAST_CONSOLIDATED_AT, System.currentTimeMillis())
                      .putString(KEY_LAST_KNOWLEDGE_ID, knowledgeId)
                      .putString(KEY_LAST_RESULT_SHA256, resultSha256)
                      .apply()
              }
          
              fun lifecycleSummary(analysis: MemoryLifecycleAnalysis): String =
                  buildString {
                      append("Memory Lifecycle 0.0.7 : ")
                      append("${analysis.sourceCount} source(s), ")
                      append("${analysis.newCount} NEW, ")
                      append("${analysis.confirmedCount} CONFIRMED ")
                      append("dans ${analysis.confirmationGroups} groupe(s), ")
                      append("${analysis.contradictionCount} CONTRADICTORY, ")
                      append("${analysis.obsoleteCandidateCount} OBSOLETE_CANDIDATE. ")
                      append("Empreinte : ${analysis.sourceFingerprint.take(16)}.")
                  }
          
              private fun sourceFingerprint(memories: List<MemorySnapshot>): String {
                  if (memories.isEmpty()) return sha256("empty")
          
                  val canonical = memories
                      .map { memory ->
                          listOf(
                              memory.id,
                              memory.type,
                              normalize(memory.content),
                              memory.source,
                              "%.6f".format(java.util.Locale.US, memory.confidence)
                          ).joinToString("|")
                      }
                      .sorted()
                      .joinToString("\n")
          
                  return sha256(canonical)
              }
          
              private fun findContradictions(
                  memories: List<MemorySnapshot>
              ): List<Pair<MemorySnapshot, MemorySnapshot>> {
                  val pairs = mutableListOf<Pair<MemorySnapshot, MemorySnapshot>>()
          
                  for (leftIndex in 0 until memories.size) {
                      val left = memories[leftIndex]
                      val leftTokens = semanticTokens(left.content)
                      if (leftTokens.size < 2) continue
          
                      for (rightIndex in leftIndex + 1 until memories.size) {
                          val right = memories[rightIndex]
                          val rightTokens = semanticTokens(right.content)
                          if (rightTokens.size < 2) continue
          
                          val union = leftTokens union rightTokens
                          if (union.isEmpty()) continue
          
                          val similarity =
                              (leftTokens intersect rightTokens).size.toDouble() /
                                  union.size.toDouble()
          
                          if (
                              similarity >= 0.6 &&
                              hasNegation(left.content) != hasNegation(right.content)
                          ) {
                              pairs += left to right
                          }
                      }
                  }
          
                  return pairs
              }
          
              private fun semanticTokens(text: String): Set<String> =
                  tokenize(text)
                      .map {
                          it.removePrefix("n'")
                              .removePrefix("n’")
                      }
                      .filterNot {
                          it.isBlank() ||
                              it in STOP_WORDS ||
                              it in NEGATION_WORDS
                      }
                      .toSet()
          
              private fun hasNegation(text: String): Boolean {
                  val lower = " ${text.lowercase()}"
                  return " n'" in lower ||
                      " n’" in lower ||
                      tokenize(text).any { it in NEGATION_WORDS }
              }
          
              private fun normalize(text: String): String =
                  tokenize(text).joinToString(" ")
          
              private fun tokenize(text: String): List<String> =
                  Regex("[\\p{L}\\p{N}'’-]+")
                      .findAll(text)
                      .map { it.value.lowercase() }
                      .toList()
          
              private fun sha256(value: String): String =
                  MessageDigest.getInstance("SHA-256")
                      .digest(value.toByteArray(Charsets.UTF_8))
                      .joinToString("") { byte ->
                          "%02x".format(byte.toInt() and 0xff)
                      }
          }
          
          KOTLIN

          cat > "$RUNNER_TEMP/apply-v007.py" <<'PY'
          from pathlib import Path
          
          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
          
          replace_once(
              "android/app/build.gradle.kts",
              'versionCode = 6\n        versionName = "0.0.6"',
              'versionCode = 7\n        versionName = "0.0.7"'
          )
          
          replace_once(
              "android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt",
              'const val CURRENT_VERSION = "0.0.6"',
              'const val CURRENT_VERSION = "0.0.7"'
          )
          
          replace_once(
              "android/app/src/main/java/com/jadegenesis/mobile/model/Models.kt",
              'val version: String = "0.0.6"',
              'val version: String = "0.0.7"'
          )
          
          replace_once(
              "android/app/src/main/java/com/jadegenesis/mobile/ui/JadeApp.kt",
              '(state.selfModel?.identity?.version ?: "0.0.6")',
              '(state.selfModel?.identity?.version ?: "0.0.7")'
          )
          
          replace_once(
              "android/app/src/main/java/com/jadegenesis/mobile/ui/JadeApp.kt",
              '''                        Text(
                                      "La consolidation crée une connaissance traçable sans supprimer les mémoires sources."
                                  )
          ''',
              '''                        Text(
                                      "La consolidation crée une connaissance traçable sans supprimer les mémoires sources."
                                  )
                                  Text(
                                      "Memory Lifecycle 0.0.7 empreinte le lot et bloque une consolidation identique."
                                  )
          '''
          )
          
          core = "android/app/src/main/java/com/jadegenesis/mobile/core/JadeCore.kt"
          
          replace_once(
              core,
              '''import com.jadegenesis.mobile.memory.JadeDatabase
          import com.jadegenesis.mobile.memory.MemoryStore
          ''',
              '''import com.jadegenesis.mobile.memory.JadeDatabase
          import com.jadegenesis.mobile.memory.MemoryLifecycleAnalysis
          import com.jadegenesis.mobile.memory.MemoryLifecycleManager
          import com.jadegenesis.mobile.memory.MemoryStore
          '''
          )
          
          replace_once(
              core,
              '''import com.jadegenesis.mobile.model.BrainInfo
          import com.jadegenesis.mobile.model.DistributedTaskResult
          ''',
              '''import com.jadegenesis.mobile.model.BrainInfo
          import com.jadegenesis.mobile.model.DeviceProfile
          import com.jadegenesis.mobile.model.DistributedTaskResult
          '''
          )
          
          replace_once(
              core,
              '''import com.jadegenesis.mobile.model.SelfModel
          import com.jadegenesis.mobile.node.NodeManager
          ''',
              '''import com.jadegenesis.mobile.model.SelfModel
          import com.jadegenesis.mobile.model.TaskExecutionLocation
          import com.jadegenesis.mobile.model.TaskStatus
          import com.jadegenesis.mobile.node.NodeManager
          '''
          )
          
          replace_once(
              core,
              '''import org.json.JSONObject
          ''',
              '''import org.json.JSONObject
          import java.security.MessageDigest
          import java.util.UUID
          '''
          )
          
          replace_once(
              core,
              '''    private val memory = MemoryStore(
                  JadeDatabase.get(appContext).memoryDao()
              )
              private val selfModelBuilder = SelfModelBuilder()
          ''',
              '''    private val memory = MemoryStore(
                  JadeDatabase.get(appContext).memoryDao()
              )
              private val memoryLifecycle = MemoryLifecycleManager(appContext)
              private val selfModelBuilder = SelfModelBuilder()
          '''
          )
          
          old_consolidation = '''    suspend fun runMemoryConsolidation(): DistributedTaskResult {
                  val activeIdentity = activeIdentity()
                  val device = profiler.capture()
                  val resourceBudget = resourceGovernor.evaluate(device)
                  val sourceMemories = memory.latest(24)
          
                  val result = taskRouter.runMemoryConsolidation(
                      identityId = activeIdentity.jadeId,
                      memories = sourceMemories,
                      device = device,
                      budget = resourceBudget
                  )
          
                  if (result.success) {
                      val json = JSONObject(result.output)
                      val summary = json
                          .optString("summary")
                          .trim()
                          .ifBlank {
                              "Consolidation terminée sans résumé textuel."
                          }
                      val duplicateGroups = json.optInt("duplicate_groups", 0)
                      val contradictions =
                          json.optInt("potential_contradictions", 0)
          
                      memory.remember(
                          type = MemoryType.KNOWLEDGE,
                          content = buildString {
                              append("Consolidation mémoire 0.0.6 : ")
                              append(summary)
                              append(
                                  " Doublons groupés : $duplicateGroups. " +
                                      "Contradictions potentielles : $contradictions."
                              )
                          },
                          source = "JADE_CONSOLIDATION_0.0.6",
                          confidence = 0.85,
                          originNode = result.executedNodeId
                      )
                  }
          
                  return result
              }
          '''
          
          new_consolidation = '''    suspend fun runMemoryConsolidation(): DistributedTaskResult {
                  val activeIdentity = activeIdentity()
                  val device = profiler.capture()
                  val resourceBudget = resourceGovernor.evaluate(device)
                  val recentMemories = memory.latest(64)
                  val sourceMemories = memoryLifecycle.sourceMemories(recentMemories)
                  val lifecycle = memoryLifecycle.analyze(sourceMemories)
          
                  if (!lifecycle.needsConsolidation) {
                      return lifecycleNoOpResult(
                          analysis = lifecycle,
                          device = device
                      )
                  }
          
                  val result = taskRouter.runMemoryConsolidation(
                      identityId = activeIdentity.jadeId,
                      memories = sourceMemories,
                      device = device,
                      budget = resourceBudget
                  )
          
                  if (result.success) {
                      val json = JSONObject(result.output)
                      val summary = json
                          .optString("summary")
                          .trim()
                          .ifBlank {
                              "Consolidation terminée sans résumé textuel."
                          }
                      val duplicateGroups = json.optInt("duplicate_groups", 0)
                      val contradictions =
                          json.optInt("potential_contradictions", 0)
          
                      val knowledge = memory.remember(
                          type = MemoryType.KNOWLEDGE,
                          content = buildString {
                              append("Consolidation mémoire 0.0.7 : ")
                              append(memoryLifecycle.lifecycleSummary(lifecycle))
                              append(" ")
                              append(summary)
                              append(
                                  " Doublons groupés : $duplicateGroups. " +
                                      "Contradictions potentielles : $contradictions. "
                              )
                              append(
                                  "Les mémoires sources restent intactes ; " +
                                      "OBSOLETE_CANDIDATE n'entraîne jamais une suppression automatique."
                              )
                          },
                          source = "JADE_CONSOLIDATION_0.0.7",
                          confidence = 0.88,
                          originNode = result.executedNodeId
                      )
          
                      memoryLifecycle.markConsolidated(
                          analysis = lifecycle,
                          knowledgeId = knowledge.id,
                          resultSha256 = sha256(result.output)
                      )
                  }
          
                  return result
              }
          '''
          
          replace_once(core, old_consolidation, new_consolidation)
          
          replace_once(
              core,
              '''    private suspend fun activeIdentity(): JadeIdentity =
          ''',
              '''    private fun lifecycleNoOpResult(
                  analysis: MemoryLifecycleAnalysis,
                  device: DeviceProfile
              ): DistributedTaskResult {
                  val now = System.currentTimeMillis()
                  val local = nodeManager.localNode(device)
                  val output = JSONObject().apply {
                      put("skipped", true)
                      put("reason", analysis.reason)
                      put(
                          "lifecycle_summary",
                          memoryLifecycle.lifecycleSummary(analysis)
                      )
                      put("source_fingerprint", analysis.sourceFingerprint)
                      put("source_count", analysis.sourceCount)
                      put("new_count", analysis.newCount)
                      put("confirmed_count", analysis.confirmedCount)
                      put("contradiction_count", analysis.contradictionCount)
                      put(
                          "obsolete_candidate_count",
                          analysis.obsoleteCandidateCount
                      )
                      put("last_consolidated_at", analysis.lastConsolidatedAt)
                  }.toString()
          
                  return DistributedTaskResult(
                      taskId = "lifecycle-${UUID.randomUUID()}",
                      taskKind = "memory_lifecycle_noop",
                      requestedNodeId = null,
                      requestedNodeName = null,
                      executedNodeId = local.nodeId,
                      executedNodeName = local.name,
                      executionLocation = TaskExecutionLocation.LOCAL,
                      status = TaskStatus.COMPLETED,
                      success = true,
                      output = output,
                      durationMs = 0L,
                      fallbackUsed = false,
                      fallbackReason = null,
                      routeReason = analysis.reason,
                      attempts = emptyList(),
                      startedAt = now,
                      completedAt = now
                  )
              }
          
              private fun sha256(value: String): String =
                  MessageDigest.getInstance("SHA-256")
                      .digest(value.toByteArray(Charsets.UTF_8))
                      .joinToString("") { byte ->
                          "%02x".format(byte.toInt() and 0xff)
                      }
          
              private suspend fun activeIdentity(): JadeIdentity =
          '''
          )
          
          view_model = "android/app/src/main/java/com/jadegenesis/mobile/ui/JadeViewModel.kt"
          
          replace_once(
              view_model,
              '''            beginTask(
                          "Jade prépare un lot de mémoire, le place dans la file et choisit un nœud…"
                      )
          ''',
              '''            beginTask(
                          "Memory Lifecycle 0.0.7 vérifie d'abord si les sources ont réellement changé…"
                      )
          '''
          )
          
          replace_once(
              view_model,
              '''            taskMessage = buildString {
                          append(
                              "Tâche ${result.taskKind} exécutée sur " +
                                  "${result.executedNodeName}."
                          )
                          if (result.fallbackUsed) {
                              append(" Fallback utilisé.")
                          }
                          if (
                              result.success &&
                              result.taskKind == "memory_consolidation"
                          ) {
                              append(" Une connaissance consolidée a été ajoutée à ma mémoire.")
                          }
                      },
          ''',
              '''            taskMessage = taskCompletionMessage(result),
          '''
          )
          
          replace_once(
              view_model,
              '''    private fun failTask(e: Throwable) {
          ''',
              '''    private fun taskCompletionMessage(
                  result: DistributedTaskResult
              ): String = when (result.taskKind) {
                  "memory_lifecycle_noop" ->
                      "Memory Lifecycle 0.0.7 : aucune nouvelle source à apprendre. " +
                          "La consolidation identique a été bloquée et aucune " +
                          "connaissance supplémentaire n'a été créée."
          
                  "memory_consolidation" -> buildString {
                      append(
                          "Tâche memory_consolidation exécutée sur " +
                              "${result.executedNodeName}."
                      )
                      if (result.fallbackUsed) {
                          append(" Fallback utilisé.")
                      }
                      if (result.success) {
                          append(
                              " Une connaissance 0.0.7 traçable a été ajoutée ; " +
                                  "l'empreinte du lot est maintenant enregistrée."
                          )
                      }
                  }
          
                  else -> buildString {
                      append(
                          "Tâche ${result.taskKind} exécutée sur " +
                              "${result.executedNodeName}."
                      )
                      if (result.fallbackUsed) {
                          append(" Fallback utilisé.")
                      }
                  }
              }
          
              private fun failTask(e: Throwable) {
          '''
          )
          
          self_model = "android/app/src/main/java/com/jadegenesis/mobile/selfmodel/SelfModelBuilder.kt"
          
          replace_once(
              self_model,
              '''            Capability("persistent_identity", true, "DataStore"),
                      Capability("local_memory", true, "Room 3"),
                      Capability(
                          "device_inspection",
          ''',
              '''            Capability("persistent_identity", true, "DataStore"),
                      Capability("local_memory", true, "Room 3"),
                      Capability(
                          "memory_lifecycle",
                          true,
                          "MemoryLifecycleManager 0.0.7",
                          "Empreinte les sources, bloque les consolidations identiques et classe NEW/CONFIRMED/CONTRADICTORY/OBSOLETE_CANDIDATE sans suppression automatique."
                      ),
                      Capability(
                          "device_inspection",
          '''
          )
          
          replace_once(
              self_model,
              '''                "Analyse un lot de mémoire, détecte doublons et contradictions potentielles puis stocke une connaissance consolidée."
          ''',
              '''                "La consolidation reste distribuable ; Memory Lifecycle 0.0.7 décide d'abord si le lot a réellement changé."
          '''
          )
          
          replace_once(
              self_model,
              '''            "La consolidation 0.0.6 est déterministe et heuristique : une contradiction détectée est un signal à vérifier, pas une vérité automatiquement tranchée.",
          ''',
              '''            "Memory Lifecycle 0.0.7 classe les contradictions et l'obsolescence comme des candidats à vérifier ; il ne tranche ni ne supprime automatiquement une mémoire.",
                      "La détection de contradiction reste déterministe et heuristique : elle produit un signal, pas une vérité.",
          '''
          )
          
          print("V0.0.7 source patch applied.")
          
          PY

          python3 "$RUNNER_TEMP/apply-v007.py"

      - name: Verify 0.0.7 source
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 7' android/app/build.gradle.kts
          grep -F 'versionName = "0.0.7"' android/app/build.gradle.kts
          grep -F 'CURRENT_VERSION = "0.0.7"' android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt
          grep -F 'MemoryLifecycleManager 0.0.7' android/app/src/main/java/com/jadegenesis/mobile/selfmodel/SelfModelBuilder.kt
          grep -F 'memory_lifecycle_noop' android/app/src/main/java/com/jadegenesis/mobile/core/JadeCore.kt
          grep -F 'JADE_CONSOLIDATION_0.0.7' android/app/src/main/java/com/jadegenesis/mobile/core/JadeCore.kt

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build Jade APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK and stable signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$SIGNATURE_OUTPUT"

          ACTUAL="$(
            printf '%s\n' "$SIGNATURE_OUTPUT" \
              | sed -n 's/^.*certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr '[:upper:]' '[:lower:]'
          )"
          EXPECTED="0b74e3f3d627ebd7f53454caf8dca65312099de702171af8bfb3a674fd484992"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Unexpected APK signing certificate."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

      - name: Store Jade 0.0.7 source in repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jade Genesis Builder"
          git config user.email "jade-genesis-builder@users.noreply.github.com"
          git add android

          if git diff --cached --quiet; then
            echo "Source already matches 0.0.7."
          else
            git commit -m "Jade Genesis Android 0.0.7 Memory Lifecycle [skip ci]"
            git push origin HEAD:main
          fi

      - name: Package Jade Genesis 0.0.7 notes
        shell: bash
        run: |
          set -euo pipefail
          cat > V0.0.7-NOTES.txt <<'EOF'
          Jade Genesis 0.0.7 — Memory Lifecycle
          - Same persistent identity and Room memory database
          - Memory source fingerprinting
          - Identical-consolidation suppression
          - NEW / CONFIRMED / CONTRADICTORY / OBSOLETE_CANDIDATE / STABLE lifecycle
          - No automatic deletion of source memories
          - Existing PC Node Runtime 0.0.6 remains compatible; no PC reinstall required
          EOF

      - name: Upload Jade Genesis 0.0.7 bundle
        uses: actions/upload-artifact@v4
        with:
          name: Jade-Genesis-0.0.7
          if-no-files-found: error
          retention-days: 90
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            V0.0.7-NOTES.txt
