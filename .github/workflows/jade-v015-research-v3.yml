          SIGNATURE_FILE="$RUNNER_TEMP/v015-signature.txt"
          EXPECTED_DIGEST="0b74e3f3d627ebd7f53454caf8dca65312099de702171af8bfb3a674fd484992"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK" \
            | tee "$SIGNATURE_FILE"

          grep -F "Number of signers: 1" "$SIGNATURE_FILE" >/dev/null

          ACTUAL_DIGEST="$(
            sed -n 's/^Signer #1 certificate SHA-256 digest:[[:space:]]*//p' "$SIGNATURE_FILE" \
              | head -n 1 \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d ':[:space:]'
          )"

          if [ -z "$ACTUAL_DIGEST" ] || [ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "ERROR: APK signer fingerprint does not match the stable Jade key."
            exit 1
          fi

          echo "Stable Jade signing fingerprint verified."

      - name: Package verified V0.1.5 sources
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/jade-v015-sources"
          mkdir -p "$OUT/src/test/java/com/jadegenesis/mobile/research"

          cp android/app/build.gradle.kts "$OUT/build.gradle.kts"
          cp -R android/app/src/main "$OUT/main"
          cp \
            android/app/src/test/java/com/jadegenesis/mobile/research/ResearchEngineTest.kt \
            "$OUT/src/test/java/com/jadegenesis/mobile/research/ResearchEngineTest.kt"

          {
            echo "Jade Genesis V0.1.5 verified sources"
            echo "source_commit=$GITHUB_SHA"
            echo "workflow_run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "versionCode=15"
            echo "versionName=0.1.5"
            echo "research=Research v3 entity-router"
            echo "apk_sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/v015-apk.sha256")"
            echo "signing_sha256=0b74e3f3d627ebd7f53454caf8dca65312099de702171af8bfb3a674fd484992"
          } > "$OUT/VERIFIED.txt"

      - name: Upload verified V0.1.5 sources
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jade-Genesis-0.1.5-verified-sources
          path: ${{ runner.temp }}/jade-v015-sources/
          if-no-files-found: error
          retention-days: 30

      - name: Package verified V0.1.5 APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/jade-v015-verified"
          mkdir -p "$OUT"

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            "$OUT/Jade-Genesis-0.1.5.apk"

          cp \
            "$RUNNER_TEMP/v015-apk.sha256" \
            "$OUT/Jade-Genesis-0.1.5.apk.sha256.txt"

          cp \
            "$RUNNER_TEMP/v015-signature.txt" \
            "$OUT/Jade-Genesis-0.1.5.signature.txt"

      - name: Upload verified V0.1.5 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jade-Genesis-0.1.5-verified
          path: ${{ runner.temp }}/jade-v015-verified/
          if-no-files-found: error
          retention-days: 30

      - name: Persist verified V0.1.5 source on isolated branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          SNAP="$RUNNER_TEMP/v015-source-snapshot"
          rm -rf "$SNAP"
          mkdir -p "$SNAP/src/test/java/com/jadegenesis/mobile/research"

          cp android/app/build.gradle.kts "$SNAP/build.gradle.kts"
          cp -R android/app/src/main "$SNAP/main"
          cp \
            android/app/src/test/java/com/jadegenesis/mobile/research/ResearchEngineTest.kt \
            "$SNAP/src/test/java/com/jadegenesis/mobile/research/ResearchEngineTest.kt"

          APK_SHA="$(cut -d' ' -f1 "$RUNNER_TEMP/v015-apk.sha256")"

          git reset --hard "$GITHUB_SHA"
          git clean -fdx android

          rm -rf android/app/src/main
          mkdir -p android/app/src/main
          cp -R "$SNAP/main/." android/app/src/main/
          cp "$SNAP/build.gradle.kts" android/app/build.gradle.kts

          mkdir -p android/app/src/test/java/com/jadegenesis/mobile/research
          cp \
            "$SNAP/src/test/java/com/jadegenesis/mobile/research/ResearchEngineTest.kt" \
            android/app/src/test/java/com/jadegenesis/mobile/research/ResearchEngineTest.kt

          cat > android/VERIFIED_V0.1.5.md <<EOF
          # Jade Genesis V0.1.5 — verified source

          - Version code: 15
          - Version name: 0.1.5
          - Research: v3 entity-router
          - APK SHA-256: $APK_SHA
          - Stable signing SHA-256: 0b74e3f3d627ebd7f53454caf8dca65312099de702171af8bfb3a674fd484992
          - Verification run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          This branch contains the Android source that passed unit tests, Android compilation,
          APK version verification and stable-signature verification in the run above.
          EOF

          git add \
            android/app/build.gradle.kts \
            android/app/src/main \
            android/app/src/test/java/com/jadegenesis/mobile/research/ResearchEngineTest.kt \
            android/VERIFIED_V0.1.5.md

          if git diff --cached --quiet; then
            echo "ERROR: no verified V0.1.5 source changes to persist."
            exit 1
          fi

          echo "=== Files in verified source commit ==="
          git diff --cached --name-only

          if git diff --cached --name-only | grep -Ev '^(android/app/build\.gradle\.kts|android/app/src/main/|android/app/src/test/java/com/jadegenesis/mobile/research/ResearchEngineTest\.kt|android/VERIFIED_V0\.1\.5\.md)$' >/dev/null; then
            echo "ERROR: unexpected file outside the V0.1.5 source allowlist."
            exit 1
          fi

          git config user.name "Jade Genesis CI"
          git config user.email "actions@jade-genesis.local"
          git commit -m "feat: Jade Genesis V0.1.5 Research v3 verified source"

          git push --force origin HEAD:refs/heads/jade-v015-verified

          echo "Verified source branch updated: jade-v015-verified"
          echo "verified_source_commit=$(git rev-parse HEAD)"
