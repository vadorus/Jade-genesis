                  logger?.log(
                      DiagnosticLevel.INFO,
                      "task_remote_complete",
                      "${request.taskKind} terminé sur ${response.nodeName}.",
                      mapOf(
                          "task_id" to request.taskId,
                          "node_id" to response.nodeId,
                          "duration_ms" to response.durationMs
                      )
                  )
