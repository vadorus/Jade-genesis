                              diagnostics = core.recentDiagnostics(),
                              error = e.message ?: e.toString()
                          )
                      }
              }
          }

          '''
          if tool_anchor not in text:
              raise SystemExit("Missing patch anchor: ViewModel tool method")
          text = text.replace(tool_anchor, research_vm + tool_anchor, 1)
          write(vm_path, text)

          # ------------------------------------------------------------------
          # Jade UI: replace complete card using stable boundary markers.
          # ------------------------------------------------------------------
          app_path = "android/app/src/main/java/com/jadegenesis/mobile/ui/JadeApp.kt"
          text = read(app_path)
          card_start = '        InfoCard("Screen Observer v1") {'
