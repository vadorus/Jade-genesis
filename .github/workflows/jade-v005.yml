      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify 0.0.5 source and environment
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 5' android/app/build.gradle.kts
          grep -F 'versionName = "0.0.5"' android/app/build.gradle.kts
          grep -F 'ACCESS_LOCAL_NETWORK' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/jadegenesis/mobile/task/TaskLedger.kt
          grep -F 'AdaptiveTaskRouter 0.0.5' android/app/src/main/java/com/jadegenesis/mobile/selfmodel/SelfModelBuilder.kt
          grep -F 'task_execution_v2' android/app/src/main/java/com/jadegenesis/mobile/node/NodeManager.kt
          grep -F 'text_analysis' android/app/src/main/java/com/jadegenesis/mobile/task/TaskRouter.kt
          grep -F 'PROTOCOL = "jade-genesis-node/0.0.5"' node-agent/jade_node_agent.py
          grep -F 'ALLOWED_TASKS = ("genesis_probe", "text_analysis")' node-agent/jade_node_agent.py
          java -version
          gradle --version
          sdkmanager --version

      - name: Test PC Adaptive Distributed Node Runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile node-agent/jade_node_agent.py
          python3 node-agent/jade_node_agent.py --self-test

          TEST_HOME="$RUNNER_TEMP/jade-node-http-test"
          mkdir -p "$TEST_HOME"
          HOME="$TEST_HOME" python3 node-agent/jade_node_agent.py --port 18765 > "$RUNNER_TEMP/jade-node-http.log" 2>&1 &
          NODE_PID=$!
          cleanup() {
            kill "$NODE_PID" 2>/dev/null || true
            wait "$NODE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if [ -f "$TEST_HOME/.jade-genesis/node-agent.json" ]; then
              TOKEN="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["token"])' "$TEST_HOME/.jade-genesis/node-agent.json")"
              if curl --silent --fail \
                -H "X-Jade-Token: $TOKEN" \
                "http://127.0.0.1:18765/health" \
                > "$RUNNER_TEMP/health.json"; then
                break
              fi
            fi
            sleep 0.25
          done

          test -s "$RUNNER_TEMP/health.json"
          python3 - "$RUNNER_TEMP/health.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["protocol"] == "jade-genesis-node/0.0.5", data
          caps = set(data["capabilities"])
          assert {"task_execution_v2", "genesis_probe", "text_analysis"} <= caps, data
          print("HTTP health OK:", data["node_id"])
          PY

          cat > "$RUNNER_TEMP/task.json" <<'JSON'
          {"protocol":"jade-genesis-node/0.0.5","task_id":"ci-text-analysis","task_kind":"text_analysis","payload":"Jade Jade Genesis test","iterations":0}
          JSON

          curl --silent --fail \
            -H "X-Jade-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/task.json" \
            "http://127.0.0.1:18765/task" \
            > "$RUNNER_TEMP/task-result.json"

          python3 - "$RUNNER_TEMP/task-result.json" <<'PY'
          import hashlib, json, sys
          response = json.load(open(sys.argv[1], encoding="utf-8"))
          assert response["success"] is True, response
          assert response["task_kind"] == "text_analysis", response
          result = json.loads(response["result"])
          assert result["words"] == 4, result
          assert result["unique_words"] == 3, result
          assert result["sha256"] == hashlib.sha256("Jade Jade Genesis test".encode()).hexdigest(), result
          print("HTTP text_analysis OK:", result)
          PY

          cleanup
          trap - EXIT

      - name: Build Jade APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:assembleDebug --stacktrace

      - name: Verify APK and stable signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: No APK generated"
            exit 1
          fi

          SIGNATURE_OUTPUT="$(
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
              verify \
              --print-certs \
              "$APK"
          )"
          echo "$SIGNATURE_OUTPUT"

          ACTUAL="$(
            printf '%s\n' "$SIGNATURE_OUTPUT" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr '[:upper:]' '[:lower:]'
          )"
          EXPECTED="0b74e3f3d627ebd7f53454caf8dca65312099de702171af8bfb3a674fd484992"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Unexpected APK signing certificate."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          echo "Stable Jade certificate verified."
          cp "$APK" "$RUNNER_TEMP/Jade-Genesis-0.0.5.apk"
          sha256sum "$RUNNER_TEMP/Jade-Genesis-0.0.5.apk"

      - name: Store Jade 0.0.5 source in repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jade Genesis Builder"
          git config user.email "jade-genesis-builder@users.noreply.github.com"

          PUSHED=0
          for ATTEMPT in 1 2 3; do
            echo "Source publish attempt $ATTEMPT/3"
            git fetch origin main
            git reset --hard origin/main
            tar -xzf "$RUNNER_TEMP/jade-v005-source.tar.gz" -C .
            rm -rf node-agent/__pycache__
            git add android node-agent

            if git diff --cached --quiet; then
              echo "Jade 0.0.5 source is already current on main."
              PUSHED=1
              break
            fi

            git commit -m "Jade Genesis Android 0.0.5 Adaptive Distributed Tasks [skip ci]"
            if git push origin HEAD:main; then
              PUSHED=1
              break
            fi

            echo "Push raced with another workflow; retrying from latest main."
            sleep 12
          done

          if [ "$PUSHED" -ne 1 ]; then
            echo "ERROR: Could not publish Jade 0.0.5 source after retries."
            exit 1
          fi

      - name: Package Jade Genesis 0.0.5 bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/Jade-Genesis-0.0.5"
          mkdir -p "$BUNDLE"
          cp "$RUNNER_TEMP/Jade-Genesis-0.0.5.apk" "$BUNDLE/Jade-Genesis-0.0.5.apk"
          cp node-agent/jade_node_agent.py "$BUNDLE/Jade-Genesis-Node-Runtime-0.0.5.py"
          cp node-agent/README.md "$BUNDLE/PC-Node-Runtime-README.md"
          cp "$RUNNER_TEMP/jade-v005-source.tar.gz" "$BUNDLE/Jade-Genesis-0.0.5-source.tar.gz"

          cat > "$BUNDLE/BUILD-INFO.txt" <<'EOF'
          Jade Genesis 0.0.5 — Adaptive Distributed Tasks
          Android: versionCode 5 / versionName 0.0.5
          Node protocol: jade-genesis-node/0.0.5
          Safe distributed task allowlist: genesis_probe, text_analysis
          Generic Task Router: capability-aware, resource-aware, measured-history-aware
          Persistent Task Ledger: enabled
          Remote failure fallback: enabled
          Arbitrary system command execution: disabled
          EOF

          sha256sum "$BUNDLE"/* > "$BUNDLE/SHA256SUMS.txt"
          cat "$BUNDLE/SHA256SUMS.txt"

      - name: Upload Jade Genesis 0.0.5 bundle
        uses: actions/upload-artifact@v4
        with:
          name: Jade-Genesis-0.0.5
          path: ${{ runner.temp }}/Jade-Genesis-0.0.5/
          if-no-files-found: error
          retention-days: 90
