name: Build Jade Genesis Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: platform-tools

      - name: Install Android API 37.0
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager             --channel=3             "platforms;android-37.0"             "build-tools;36.0.0"             "platform-tools"

      - name: Prepare Android source tree
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "android/app/src/main" ]; then
            echo "Using Android source already stored in repository."
          else
            echo "Extracting legacy Android source ZIP."
            rm -rf android jade-genesis-android-0.0.1
            unzip -o jade-genesis-android-0.0.1.zip
            mv jade-genesis-android-0.0.1 android
          fi

          echo "PROJECT_DIR=android" >> "$GITHUB_ENV"

          echo "===== Android project files ====="
          find android -maxdepth 6 -type f -print

      - name: Normalize Android 17 and AGP 9 configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          project = Path("android")
          app_gradle = project / "app" / "build.gradle.kts"
          root_gradle = project / "build.gradle.kts"
          settings_gradle = project / "settings.gradle.kts"

          if not app_gradle.exists():
              raise SystemExit("ERROR: app/build.gradle.kts not found")

          for gradle_file in (root_gradle, settings_gradle):
              if not gradle_file.exists():
                  continue

              text = gradle_file.read_text(encoding="utf-8")
              text = re.sub(
                  r'(id\("com\.android\.application"\)\s+version\s+")[^"]+(")',
                  r'\g<1>9.4.0\2',
                  text,
              )
              gradle_file.write_text(text, encoding="utf-8")

          app = app_gradle.read_text(encoding="utf-8")
          app = re.sub(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 37',
              app,
              count=1,
          )
          app = re.sub(
              r'(?m)^\s*id\("org\.jetbrains\.kotlin\.android"\)\s*\n?',
              '',
              app,
          )
          app = re.sub(
              r'(?ms)^\s*kotlinOptions\s*\{.*?^\s*\}\s*\n?',
              '',
              app,
          )
          app_gradle.write_text(app, encoding="utf-8")
          PY

      - name: Store Android source in repository
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain -- android)" ]; then
            git config user.name "Jade Genesis CI"
            git config user.email "actions@users.noreply.github.com"
            git add android
            git commit -m "Extract Android source tree [skip ci]"
            git push origin HEAD:main
          else
            echo "Android source tree is already committed."
          fi

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          find "$ANDROID_SDK_ROOT/platforms" -maxdepth 2 -name android.jar -print

      - name: Build Jade APK
        shell: bash
        run: |
          set -euo pipefail
          gradle             -p "$PROJECT_DIR"             :app:assembleDebug             --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_COUNT="$(
            find               "$PROJECT_DIR/app/build/outputs"               -type f               -name "*.apk"               | wc -l
          )"

          find             "$PROJECT_DIR/app/build/outputs"             -type f             -name "*.apk"             -print

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated"
            exit 1
          fi

      - name: Upload Jade Genesis APK
        uses: actions/upload-artifact@v4
        with:
          name: Jade-Genesis-Android-0.0.1
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
