name: Build Jade Genesis V0.1.4 Targeted Observation Research v2

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/jade-v014-targeted-observation-research-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout V0.1.4 sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up real Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37 and Build Tools 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Restore stable Jade signing key
        shell: bash
        env:
          JADE_SIGNING_BUNDLE_B64: ${{ secrets.JADE_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${JADE_SIGNING_BUNDLE_B64:-}" ]; then
            echo "ERROR: GitHub secret JADE_SIGNING_BUNDLE_B64 is missing."
            exit 1
          fi
          SIGN_DIR="$RUNNER_TEMP/jade-signing"
          mkdir -p "$SIGN_DIR"
          printf '%s' "$JADE_SIGNING_BUNDLE_B64" | base64 -d > "$SIGN_DIR/signing.tar.gz"
          tar -xzf "$SIGN_DIR/signing.tar.gz" -C "$SIGN_DIR"
          test -f "$SIGN_DIR/jade-genesis-dev.jks"
          test -f "$SIGN_DIR/password.txt"
          test -f "$SIGN_DIR/alias.txt"
          PASSWORD="$(cat "$SIGN_DIR/password.txt")"
          ALIAS="$(cat "$SIGN_DIR/alias.txt")"
          echo "::add-mask::$PASSWORD"
          echo "JADE_KEYSTORE_PATH=$SIGN_DIR/jade-genesis-dev.jks" >> "$GITHUB_ENV"
          echo "JADE_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "JADE_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Add targeted observation, image sharing and Research v2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/com/jadegenesis/mobile/screen
          cat > android/app/src/main/java/com/jadegenesis/mobile/screen/ScreenObserverRepository.kt <<'KOTLIN'
          package com.jadegenesis.mobile.screen
          
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import kotlinx.coroutines.delay
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.security.MessageDigest
          import kotlin.math.roundToInt
          
          data class ScreenFrame(
              val bytes: ByteArray,
              val capturedAt: Long,
              val sha256: String,
              val source: String,
              val focusInstruction: String
          )
          
          class ScreenObserverRepository(context: Context) {
              companion object {
                  private const val MAX_CAPTURE_WIDTH = 960
                  private const val TARGET_JPEG_BYTES = 1_050_000
              }
          
              private val appContext = context.applicationContext
              private val directory = File(appContext.filesDir, "screen-observer")
              private val latestFile = File(directory, "latest.jpg")
              private val metadataFile = File(directory, "latest.json")
          
              fun latestCaptureTimestamp(): Long =
                  latestFrame()?.capturedAt ?: 0L
          
              fun latestImageFile(): File? = latestFile.takeIf { it.isFile }
          
              fun latestBitmap(): Bitmap? =
                  latestFile.takeIf { it.isFile }?.let { file ->
                      runCatching { BitmapFactory.decodeFile(file.absolutePath) }.getOrNull()
                  }
          
              fun latestSource(): String = readMetadata().optString("source", "pixel_screen")
          
              fun latestFocusInstruction(): String =
                  readMetadata().optString("focus_instruction", "").trim()
          
              fun latestFrame(): ScreenFrame? {
                  if (!latestFile.isFile) return null
                  val bytes = runCatching { latestFile.readBytes() }.getOrNull() ?: return null
                  if (bytes.isEmpty()) return null
                  val metadata = readMetadata()
                  val capturedAt = metadata.optLong("captured_at", latestFile.lastModified())
                      .takeIf { it > 0L } ?: latestFile.lastModified()
                  return ScreenFrame(
                      bytes = bytes,
                      capturedAt = capturedAt,
                      sha256 = sha256(bytes),
                      source = metadata.optString("source", "pixel_screen").ifBlank { "pixel_screen" },
                      focusInstruction = metadata.optString("focus_instruction", "").trim()
                  )
              }
          
              suspend fun awaitFrameAfter(
                  requestedAt: Long,
                  timeoutMs: Long = 12_000L
              ): ScreenFrame {
                  val deadline = System.currentTimeMillis() + timeoutMs
                  while (System.currentTimeMillis() < deadline) {
                      val frame = latestFrame()
                      if (frame != null && frame.capturedAt >= requestedAt) {
                          return frame
                      }
                      delay(180L)
                  }
                  error("La capture d'écran Pixel n'a pas été produite à temps.")
              }
          
              fun saveBitmap(
                  bitmap: Bitmap,
                  source: String,
                  focusInstruction: String = ""
              ): ScreenFrame {
                  directory.mkdirs()
                  val normalized = normalizeWidth(bitmap)
                  val encoded = encodeBoundedJpeg(normalized)
                  if (normalized !== bitmap) normalized.recycle()
          
                  val temp = File(directory, "latest.tmp.jpg")
                  FileOutputStream(temp).use { stream ->
                      stream.write(encoded)
                      stream.flush()
                  }
                  if (latestFile.exists()) latestFile.delete()
                  check(temp.renameTo(latestFile)) { "Impossible de finaliser l'image pour Jade." }
          
                  val capturedAt = System.currentTimeMillis()
                  latestFile.setLastModified(capturedAt)
                  metadataFile.writeText(
                      JSONObject().apply {
                          put("source", source.trim().ifBlank { "unknown_image" })
                          put("focus_instruction", focusInstruction.trim().take(1_200))
                          put("captured_at", capturedAt)
                      }.toString()
                  )
                  return latestFrame() ?: error("Impossible de relire l'image enregistrée.")
              }
          
              fun importSharedImage(uri: Uri): ScreenFrame {
                  val bitmap = appContext.contentResolver.openInputStream(uri)?.use { input ->
                      BitmapFactory.decodeStream(input)
                  } ?: error("Impossible de lire l'image partagée.")
                  return try {
                      saveBitmap(
                          bitmap = bitmap,
                          source = "shared_image",
                          focusInstruction = ""
                      )
                  } finally {
                      bitmap.recycle()
                  }
              }
          
              private fun normalizeWidth(bitmap: Bitmap): Bitmap {
                  if (bitmap.width <= MAX_CAPTURE_WIDTH) return bitmap
                  val ratio = MAX_CAPTURE_WIDTH.toDouble() / bitmap.width.toDouble()
                  return Bitmap.createScaledBitmap(
                      bitmap,
                      MAX_CAPTURE_WIDTH,
                      (bitmap.height * ratio).roundToInt().coerceAtLeast(1),
                      true
                  )
              }
          
              private fun encodeBoundedJpeg(bitmap: Bitmap): ByteArray {
                  var working = bitmap
                  var ownsWorking = false
                  var last = ByteArray(0)
                  try {
                      val widths = listOf(
                          working.width,
                          minOf(working.width, 840),
                          minOf(working.width, 720)
                      ).distinct()
                      widths.forEach { targetWidth ->
                          if (working.width != targetWidth) {
                              if (ownsWorking) working.recycle()
                              val ratio = targetWidth.toDouble() / working.width.toDouble()
                              working = Bitmap.createScaledBitmap(
                                  working,
                                  targetWidth,
                                  (working.height * ratio).roundToInt().coerceAtLeast(1),
                                  true
                              )
                              ownsWorking = true
                          }
                          listOf(80, 72, 64, 56, 48).forEach { quality ->
                              val output = ByteArrayOutputStream()
                              check(bitmapOrWorkingCompress(working, quality, output)) {
                                  "Échec compression JPEG."
                              }
                              val bytes = output.toByteArray()
                              last = bytes
                              if (bytes.size <= TARGET_JPEG_BYTES) return bytes
                          }
                      }
                      return last
                  } finally {
                      if (ownsWorking) working.recycle()
                  }
              }
          
              private fun bitmapOrWorkingCompress(
                  bitmap: Bitmap,
                  quality: Int,
                  output: ByteArrayOutputStream
              ): Boolean = bitmap.compress(Bitmap.CompressFormat.JPEG, quality, output)
          
              private fun readMetadata(): JSONObject = runCatching {
                  if (!metadataFile.isFile) return@runCatching JSONObject()
                  JSONObject(metadataFile.readText())
              }.getOrDefault(JSONObject())
          
              private fun sha256(bytes: ByteArray): String =
                  MessageDigest.getInstance("SHA-256")
                      .digest(bytes)
                      .joinToString("") { byte -> "%02x".format(byte) }
          }
          KOTLIN

          mkdir -p android/app/src/main/java/com/jadegenesis/mobile/screen
          cat > android/app/src/main/java/com/jadegenesis/mobile/screen/ScreenCaptureService.kt <<'KOTLIN'
          package com.jadegenesis.mobile.screen
          
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.view.WindowManager
          import androidx.core.content.ContextCompat
          import com.jadegenesis.mobile.MainActivity
          import java.util.concurrent.atomic.AtomicBoolean
          
          class ScreenCaptureService : Service() {
          
              companion object {
                  const val MODE_IMMEDIATE = "immediate"
                  const val MODE_ARMED = "armed"
          
                  private const val EXTRA_RESULT_CODE = "result_code"
                  private const val EXTRA_RESULT_DATA = "result_data"
                  private const val EXTRA_MODE = "capture_mode"
                  private const val ACTION_CAPTURE_NOW = "com.jadegenesis.mobile.screen.CAPTURE_NOW"
                  private const val ACTION_CANCEL = "com.jadegenesis.mobile.screen.CANCEL"
                  private const val CHANNEL_ID = "jade_screen_observer"
                  private const val NOTIFICATION_ID = 4101
                  private const val READY_NOTIFICATION_ID = 4102
          
                  private const val IMMEDIATE_SETTLE_MS = 1_300L
                  private const val ARMED_SETTLE_MS = 850L
                  private const val CAPTURE_TIMEOUT_MS = 10_000L
                  private const val ARMED_SESSION_TIMEOUT_MS = 10 * 60 * 1_000L
          
                  fun startCapture(
                      context: Context,
                      resultCode: Int,
                      resultData: Intent,
                      mode: String = MODE_IMMEDIATE
                  ) {
                      val intent = Intent(context, ScreenCaptureService::class.java).apply {
                          putExtra(EXTRA_RESULT_CODE, resultCode)
                          putExtra(EXTRA_RESULT_DATA, resultData)
                          putExtra(EXTRA_MODE, mode)
                      }
                      ContextCompat.startForegroundService(context, intent)
                  }
              }
          
              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private var workerThread: HandlerThread? = null
              private var workerHandler: Handler? = null
              private var mode: String = MODE_IMMEDIATE
              private val captureStarted = AtomicBoolean(false)
              private val captured = AtomicBoolean(false)
              private val finishing = AtomicBoolean(false)
          
              override fun onBind(intent: Intent?): IBinder? = null
          
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  createNotificationChannel()
          
                  when (intent?.action) {
                      ACTION_CAPTURE_NOW -> {
                          if (projection != null && mode == MODE_ARMED) {
                              beginCapture(ARMED_SETTLE_MS)
                          }
                          return START_NOT_STICKY
                      }
                      ACTION_CANCEL -> {
                          finishCapture(false)
                          return START_NOT_STICKY
                      }
                  }
          
                  if (projection != null) return START_NOT_STICKY
          
                  mode = intent?.getStringExtra(EXTRA_MODE)
                      ?.takeIf { it == MODE_ARMED || it == MODE_IMMEDIATE }
                      ?: MODE_IMMEDIATE
          
                  startForeground(
                      NOTIFICATION_ID,
                      if (mode == MODE_ARMED) armedNotification() else immediateNotification(),
                      ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
                  )
          
                  val resultCode = intent?.getIntExtra(EXTRA_RESULT_CODE, Int.MIN_VALUE)
                      ?: Int.MIN_VALUE
                  @Suppress("DEPRECATION")
                  val resultData = intent?.getParcelableExtra<Intent>(EXTRA_RESULT_DATA)
          
                  if (resultCode == Int.MIN_VALUE || resultData == null) {
                      finishCapture(false)
                      return START_NOT_STICKY
                  }
          
                  return runCatching {
                      startProjection(resultCode, resultData)
                      START_NOT_STICKY
                  }.getOrElse {
                      finishCapture(false)
                      START_NOT_STICKY
                  }
              }
          
              private fun startProjection(resultCode: Int, resultData: Intent) {
                  val projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE)
                      as MediaProjectionManager
                  val mediaProjection = projectionManager.getMediaProjection(resultCode, resultData)
                      ?: error("MediaProjection indisponible.")
                  projection = mediaProjection
                  mediaProjection.registerCallback(
                      object : MediaProjection.Callback() {
                          override fun onStop() {
                              finishCapture(false)
                          }
                      },
                      Handler(mainLooper)
                  )
          
                  val windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val bounds = windowManager.maximumWindowMetrics.bounds
                  val width = bounds.width().coerceAtLeast(1)
                  val height = bounds.height().coerceAtLeast(1)
                  val density = resources.displayMetrics.densityDpi
          
                  val reader = ImageReader.newInstance(
                      width,
                      height,
                      PixelFormat.RGBA_8888,
                      3
                  )
                  imageReader = reader
          
                  val thread = HandlerThread("jade-screen-capture").apply { start() }
                  workerThread = thread
                  val handler = Handler(thread.looper)
                  workerHandler = handler
          
                  virtualDisplay = mediaProjection.createVirtualDisplay(
                      "JadeScreenObserver",
                      width,
                      height,
                      density,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      reader.surface,
                      null,
                      handler
                  )
          
                  if (mode == MODE_IMMEDIATE) {
                      beginCapture(IMMEDIATE_SETTLE_MS)
                  } else {
                      handler.postDelayed({
                          if (!captureStarted.get() && !finishing.get()) {
                              finishCapture(false)
                          }
                      }, ARMED_SESSION_TIMEOUT_MS)
                  }
              }
          
              private fun beginCapture(settleMs: Long) {
                  if (!captureStarted.compareAndSet(false, true)) return
                  val reader = imageReader ?: return finishCapture(false)
                  val handler = workerHandler ?: return finishCapture(false)
          
                  val manager = getSystemService(NotificationManager::class.java)
                  manager.notify(
                      NOTIFICATION_ID,
                      android.app.Notification.Builder(this, CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .setContentTitle("Jade — capture en cours")
                          .setContentText("Laisse le panneau se refermer, Jade capture ensuite l'écran.")
                          .setOngoing(true)
                          .build()
                  )
          
                  handler.postDelayed({
                      if (captured.get() || finishing.get()) return@postDelayed
                      runCatching { reader.acquireLatestImage()?.close() }
                      reader.setOnImageAvailableListener({ source ->
                          if (captured.get() || finishing.get()) {
                              source.acquireLatestImage()?.close()
                              return@setOnImageAvailableListener
                          }
                          val image = source.acquireLatestImage() ?: return@setOnImageAvailableListener
                          if (!captured.compareAndSet(false, true)) {
                              image.close()
                              return@setOnImageAvailableListener
                          }
                          try {
                              saveImage(image)
                              finishCapture(true)
                          } catch (_: Throwable) {
                              finishCapture(false)
                          } finally {
                              image.close()
                          }
                      }, handler)
                  }, settleMs)
          
                  handler.postDelayed({
                      if (!captured.get() && !finishing.get()) finishCapture(false)
                  }, settleMs + CAPTURE_TIMEOUT_MS)
              }
          
              private fun saveImage(image: Image) {
                  val width = image.width
                  val height = image.height
                  val plane = image.planes.firstOrNull() ?: error("Plan image absent.")
                  val buffer = plane.buffer
                  val pixelStride = plane.pixelStride
                  val rowStride = plane.rowStride
                  val rowPadding = rowStride - pixelStride * width
                  val paddedWidth = width + rowPadding / pixelStride
          
                  val padded = Bitmap.createBitmap(
                      paddedWidth,
                      height,
                      Bitmap.Config.ARGB_8888
                  )
                  padded.copyPixelsFromBuffer(buffer)
                  val cropped = Bitmap.createBitmap(padded, 0, 0, width, height)
                  if (cropped !== padded) padded.recycle()
                  try {
                      ScreenObserverRepository(this).saveBitmap(
                          bitmap = cropped,
                          source = if (mode == MODE_ARMED) "pixel_screen_armed" else "pixel_screen",
                          focusInstruction = ""
                      )
                  } finally {
                      cropped.recycle()
                  }
              }
          
              private fun immediateNotification(): android.app.Notification =
                  android.app.Notification.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .setContentTitle("Jade — observation d'écran")
                      .setContentText("Capture unique autorisée — stabilisation de l'image en cours")
                      .setOngoing(true)
                      .build()
          
              private fun armedNotification(): android.app.Notification {
                  val captureIntent = Intent(this, ScreenCaptureService::class.java).apply {
                      action = ACTION_CAPTURE_NOW
                  }
                  val cancelIntent = Intent(this, ScreenCaptureService::class.java).apply {
                      action = ACTION_CANCEL
                  }
                  val capturePending = PendingIntent.getService(
                      this,
                      41011,
                      captureIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val cancelPending = PendingIntent.getService(
                      this,
                      41012,
                      cancelIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  return android.app.Notification.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .setContentTitle("Jade est prête à observer")
                      .setContentText("Ouvre l'application voulue, puis touche « Capturer maintenant ».")
                      .setOngoing(true)
                      .addAction(android.R.drawable.ic_menu_camera, "Capturer maintenant", capturePending)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Annuler", cancelPending)
                      .build()
              }
          
              private fun postReadyNotification() {
                  val openCrop = Intent(this, FocusCropActivity::class.java).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                  }
                  val pending = PendingIntent.getActivity(
                      this,
                      41021,
                      openCrop,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  getSystemService(NotificationManager::class.java).notify(
                      READY_NOTIFICATION_ID,
                      android.app.Notification.Builder(this, CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.ic_menu_crop)
                          .setContentTitle("Jade — capture prête")
                          .setContentText("Touchez pour choisir la zone et préciser ce que Jade doit regarder.")
                          .setAutoCancel(true)
                          .setContentIntent(pending)
                          .build()
                  )
              }
          
              private fun createNotificationChannel() {
                  val manager = getSystemService(NotificationManager::class.java)
                  if (manager.getNotificationChannel(CHANNEL_ID) == null) {
                      manager.createNotificationChannel(
                          NotificationChannel(
                              CHANNEL_ID,
                              "Jade Screen Observer",
                              NotificationManager.IMPORTANCE_DEFAULT
                          ).apply {
                              description = "Observation d'écran visible, déclenchée uniquement par l'utilisateur."
                          }
                      )
                  }
              }
          
              @Synchronized
              private fun finishCapture(success: Boolean) {
                  if (!finishing.compareAndSet(false, true)) return
                  runCatching { virtualDisplay?.release() }
                  virtualDisplay = null
                  runCatching { imageReader?.setOnImageAvailableListener(null, null) }
                  runCatching { imageReader?.close() }
                  imageReader = null
                  val currentProjection = projection
                  projection = null
                  runCatching { currentProjection?.stop() }
                  runCatching { workerThread?.quitSafely() }
                  workerThread = null
                  workerHandler = null
                  if (success && mode == MODE_ARMED) runCatching { postReadyNotification() }
                  runCatching { stopForeground(STOP_FOREGROUND_REMOVE) }
                  stopSelf()
              }
          
              override fun onDestroy() {
                  if (!finishing.get()) finishCapture(false)
                  super.onDestroy()
              }
          }
          KOTLIN

          mkdir -p android/app/src/main/java/com/jadegenesis/mobile/screen
          cat > android/app/src/main/java/com/jadegenesis/mobile/screen/FocusCropActivity.kt <<'KOTLIN'
          package com.jadegenesis.mobile.screen
          
          import android.app.Activity
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Rect
          import android.graphics.RectF
          import android.os.Bundle
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import com.jadegenesis.mobile.MainActivity
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          
          class FocusCropActivity : Activity() {
          
              private lateinit var repository: ScreenObserverRepository
              private var sourceBitmap: Bitmap? = null
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  repository = ScreenObserverRepository(this)
                  val bitmap = repository.latestBitmap()
                  if (bitmap == null) {
                      Toast.makeText(this, "Aucune image récente à cadrer.", Toast.LENGTH_LONG).show()
                      openJadeAndFinish()
                      return
                  }
                  sourceBitmap = bitmap
          
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(14), dp(14), dp(14), dp(14))
                  }
                  root.addView(
                      TextView(this).apply {
                          text = "Choisis ce que Jade doit regarder"
                          textSize = 22f
                      },
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )
                  root.addView(
                      TextView(this).apply {
                          text = "Glisse un rectangle sur l'image. Tu peux aussi garder tout l'écran puis préciser ta demande en dessous."
                          textSize = 15f
                          setPadding(0, dp(6), 0, dp(10))
                      },
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )
          
                  val cropView = CropSelectionView(this, bitmap)
                  root.addView(
                      cropView,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )
          
                  val instruction = EditText(this).apply {
                      hint = "Ex : regarde uniquement cette erreur et identifie sa cause"
                      minLines = 2
                      maxLines = 4
                      setText(repository.latestFocusInstruction())
                  }
                  root.addView(
                      instruction,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = dp(10) }
                  )
          
                  val buttons = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val fullButton = Button(this).apply {
                      text = "Tout l'écran"
                      setOnClickListener { cropView.selectAll() }
                  }
                  val cancelButton = Button(this).apply {
                      text = "Annuler"
                      setOnClickListener { openJadeAndFinish() }
                  }
                  val useButton = Button(this).apply {
                      text = "Utiliser cette zone"
                      setOnClickListener {
                          runCatching {
                              val rect = cropView.selectedBitmapRect()
                              require(rect.width() >= 8 && rect.height() >= 8) {
                                  "La zone sélectionnée est trop petite."
                              }
                              val focused = Bitmap.createBitmap(
                                  bitmap,
                                  rect.left,
                                  rect.top,
                                  rect.width(),
                                  rect.height()
                              )
                              try {
                                  repository.saveBitmap(
                                      bitmap = focused,
                                      source = repository.latestSource().ifBlank { "focused_image" },
                                      focusInstruction = instruction.text?.toString().orEmpty()
                                  )
                              } finally {
                                  focused.recycle()
                              }
                          }.onSuccess {
                              Toast.makeText(
                                  this,
                                  "Zone prête. Dans Jade, touche « Analyser l'image ciblée ».",
                                  Toast.LENGTH_LONG
                              ).show()
                              openJadeAndFinish()
                          }.onFailure { error ->
                              Toast.makeText(
                                  this,
                                  error.message ?: "Impossible de préparer cette zone.",
                                  Toast.LENGTH_LONG
                              ).show()
                          }
                      }
                  }
                  buttons.addView(
                      fullButton,
                      LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  )
                  buttons.addView(
                      cancelButton,
                      LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  )
                  buttons.addView(
                      useButton,
                      LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1.4f)
                  )
                  root.addView(
                      buttons,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = dp(8) }
                  )
          
                  setContentView(root)
              }
          
              private fun openJadeAndFinish() {
                  startActivity(
                      Intent(this, MainActivity::class.java).apply {
                          addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                      }
                  )
                  finish()
              }
          
              override fun onDestroy() {
                  sourceBitmap?.recycle()
                  sourceBitmap = null
                  super.onDestroy()
              }
          
              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).roundToInt()
          }
          
          private class CropSelectionView(
              context: android.content.Context,
              private val bitmap: Bitmap
          ) : View(context) {
          
              private val imageRect = RectF()
              private val selection = RectF()
              private val borderPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  style = Paint.Style.STROKE
                  strokeWidth = 5f
              }
              private val shadePaint = Paint().apply {
                  color = Color.argb(120, 0, 0, 0)
                  style = Paint.Style.FILL
              }
              private var downX = 0f
              private var downY = 0f
              private var dragging = false
          
              init {
                  setBackgroundColor(Color.BLACK)
              }
          
              override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
                  super.onSizeChanged(w, h, oldw, oldh)
                  calculateImageRect(w.toFloat(), h.toFloat())
                  selectAll()
              }
          
              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  canvas.drawBitmap(bitmap, null, imageRect, null)
                  if (selection.width() <= 0f || selection.height() <= 0f) return
          
                  canvas.drawRect(imageRect.left, imageRect.top, imageRect.right, selection.top, shadePaint)
                  canvas.drawRect(imageRect.left, selection.bottom, imageRect.right, imageRect.bottom, shadePaint)
                  canvas.drawRect(imageRect.left, selection.top, selection.left, selection.bottom, shadePaint)
                  canvas.drawRect(selection.right, selection.top, imageRect.right, selection.bottom, shadePaint)
                  canvas.drawRect(selection, borderPaint)
              }
          
              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (!imageRect.contains(event.x, event.y)) {
                      if (event.action == MotionEvent.ACTION_DOWN) return false
                  }
                  val x = event.x.coerceIn(imageRect.left, imageRect.right)
                  val y = event.y.coerceIn(imageRect.top, imageRect.bottom)
                  when (event.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          downX = x
                          downY = y
                          selection.set(x, y, x, y)
                          dragging = true
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (!dragging) return false
                          selection.set(
                              min(downX, x),
                              min(downY, y),
                              max(downX, x),
                              max(downY, y)
                          )
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          dragging = false
                          if (selection.width() < 20f || selection.height() < 20f) selectAll()
                          invalidate()
                          return true
                      }
                  }
                  return super.onTouchEvent(event)
              }
          
              fun selectAll() {
                  selection.set(imageRect)
                  invalidate()
              }
          
              fun selectedBitmapRect(): Rect {
                  val selected = if (selection.width() > 0f && selection.height() > 0f) {
                      selection
                  } else {
                      imageRect
                  }
                  val left = (((selected.left - imageRect.left) / imageRect.width()) * bitmap.width)
                      .roundToInt().coerceIn(0, bitmap.width - 1)
                  val top = (((selected.top - imageRect.top) / imageRect.height()) * bitmap.height)
                      .roundToInt().coerceIn(0, bitmap.height - 1)
                  val right = (((selected.right - imageRect.left) / imageRect.width()) * bitmap.width)
                      .roundToInt().coerceIn(left + 1, bitmap.width)
                  val bottom = (((selected.bottom - imageRect.top) / imageRect.height()) * bitmap.height)
                      .roundToInt().coerceIn(top + 1, bitmap.height)
                  return Rect(left, top, right, bottom)
              }
          
              private fun calculateImageRect(viewWidth: Float, viewHeight: Float) {
                  val bitmapRatio = bitmap.width.toFloat() / bitmap.height.toFloat()
                  val viewRatio = viewWidth / viewHeight.coerceAtLeast(1f)
                  if (bitmapRatio > viewRatio) {
                      val drawnWidth = viewWidth
                      val drawnHeight = drawnWidth / bitmapRatio
                      val top = (viewHeight - drawnHeight) / 2f
                      imageRect.set(0f, top, drawnWidth, top + drawnHeight)
                  } else {
                      val drawnHeight = viewHeight
                      val drawnWidth = drawnHeight * bitmapRatio
                      val left = (viewWidth - drawnWidth) / 2f
                      imageRect.set(left, 0f, left + drawnWidth, drawnHeight)
                  }
              }
          }
