      - name: Verify V0.1.2 source before build
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 12' android/app/build.gradle.kts
          grep -F 'versionName = "0.1.2"' android/app/build.gradle.kts
          grep -F 'const val CURRENT_VERSION = "0.1.2"' android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt
          grep -F 'val version: String = "0.1.2"' android/app/src/main/java/com/jadegenesis/mobile/model/Models.kt
          grep -F 'CAPTURE_SETTLE_MS = 1_300L' android/app/src/main/java/com/jadegenesis/mobile/screen/ScreenCaptureService.kt
          grep -F 'réponds exclusivement en français' android/app/src/main/java/com/jadegenesis/mobile/core/JadeCore.kt
          grep -F 'leftToken == rightToken' android/app/src/main/java/com/jadegenesis/mobile/node/NodeManager.kt
          grep -F 'val normalized = deduplicateStoredNodes(refreshed)' android/app/src/main/java/com/jadegenesis/mobile/node/NodeManager.kt
          echo "V0.1.2 source assertions passed."

      - name: Validate compatible PC runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile node-agent/jade_node_agent.py
          grep -F 'VERSION = "0.1.1"' node-agent/jade_node_agent.py
          grep -F '"vision_analyze"' node-agent/jade_node_agent.py
          echo "PC runtime 0.1.1 retained intentionally for V0.1.2 compatibility."

      - name: Remove every stale Android build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/.gradle android/build android/app/build
          echo "Old Android build outputs removed."

      - name: Build V0.1.2 from scratch with real Gradle
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-build-cache --rerun-tasks --stacktrace clean :app:assembleDebug

      - name: Verify APK really is Jade Genesis 0.1.2
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          META="android/app/build/outputs/apk/debug/output-metadata.json"
          test -f "$APK"
          test -f "$META"
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("android/app/build/outputs/apk/debug/output-metadata.json").read_text())
          element = meta["elements"][0]
          assert element["versionCode"] == 12, element
          assert element["versionName"] == "0.1.2", element
          print("output-metadata confirms versionCode=12 versionName=0.1.2")
          PY
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/aapt-badging.txt"
          grep -F "versionCode='12'" "$RUNNER_TEMP/aapt-badging.txt"
          grep -F "versionName='0.1.2'" "$RUNNER_TEMP/aapt-badging.txt"

      - name: Verify stable Jade APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          APKSIGNER_LOG="$RUNNER_TEMP/apksigner.txt" python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path(os.environ["APKSIGNER_LOG"]).read_text(errors="replace")
          compact = re.sub(r"[^0-9A-Fa-f]", "", text).lower()
          expected = "0b74e3f3d627ebd7f53454caf8dca65312099de702171af8bfb3a674fd484992"
          if expected not in compact:
              raise SystemExit("ERROR: stable Jade signing fingerprint not found")
          print("Stable Jade signature fingerprint confirmed.")
          PY

      - name: Package verified V0.1.2 APK and compatible runtime
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/jade-v012-package"
          rm -rf "$OUT"
          mkdir -p "$OUT/node-agent"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT/Jade-Genesis-0.1.2.apk"
          cp node-agent/jade_node_agent.py "$OUT/node-agent/jade_node_agent.py"
          cat > "$OUT/README.txt" <<'EOF'
          Jade Genesis 0.1.2 — Vision Stabilization

          Android app: 0.1.2
          Compatible PC/VPS Node Runtime: 0.1.1

          Changes:
          - wait for Android MediaProjection overlay to disappear before capture
          - improve readable capture quality while bounding payload size
          - require French, factual grounding, explicit uncertainty and confidence
          - Device Registry v2.2 merges historical records by Node ID or matching runtime token
          - deduplicated registry state is returned immediately after refresh

          No token, password, signing secret or private key is included.
          EOF
          (cd "$OUT" && sha256sum Jade-Genesis-0.1.2.apk node-agent/jade_node_agent.py > SHA256SUMS.txt)
          echo "JADE_PACKAGE_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Persist verified V0.1.2 sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            android/app/build.gradle.kts \
            android/app/src/main/java/com/jadegenesis/mobile/identity/IdentityManager.kt \
            android/app/src/main/java/com/jadegenesis/mobile/model/Models.kt \
            android/app/src/main/java/com/jadegenesis/mobile/ui/JadeApp.kt \
            android/app/src/main/java/com/jadegenesis/mobile/brain/LocalPCBrain.kt \
            android/app/src/main/java/com/jadegenesis/mobile/core/JadeCore.kt \
            android/app/src/main/java/com/jadegenesis/mobile/node/NodeManager.kt \
            android/app/src/main/java/com/jadegenesis/mobile/screen/ScreenCaptureService.kt \
            android/app/src/main/java/com/jadegenesis/mobile/selfmodel/SelfModelBuilder.kt
          if git diff --cached --quiet; then
            echo "No source changes to persist."
          else
            git commit -m "Jade Genesis 0.1.2 vision stabilization [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload verified Jade Genesis 0.1.2
        uses: actions/upload-artifact@v4
        with:
          name: Jade-Genesis-0.1.2-vision-stabilization-verified
          path: ${{ env.JADE_PACKAGE_DIR }}
          retention-days: 90
          if-no-files-found: error
