          private enum class JadeTab(val label: String, val short: String) {
              JADE("Jade", "J"),
              NODES("Nœuds", "N"),
              ACTIVITY("Activité", "A"),
              MEMORY("Mémoire", "M"),
              ADMIN("Admin", "D")
          }
          
          @Composable
          fun JadeApp(vm: JadeViewModel = viewModel()) {
              val state by vm.state.collectAsState()
              val context = LocalContext.current
              var tab by remember { mutableStateOf(JadeTab.JADE) }
          
              val needsLocalNetworkPermission = Build.VERSION.SDK_INT >= 37
              var localNetworkGranted by remember {
                  mutableStateOf(
                      !needsLocalNetworkPermission ||
                          ContextCompat.checkSelfPermission(
                              context,
                              LOCAL_NETWORK_PERMISSION
                          ) == PackageManager.PERMISSION_GRANTED
                  )
              }
              val localNetworkLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted ->
                  localNetworkGranted = granted
              }
          
              val projectionManager = remember(context) {
                  context.getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
              }
              var captureMode by remember { mutableStateOf(ScreenCaptureService.MODE_IMMEDIATE) }
              var pendingArmedPermission by remember { mutableStateOf(false) }
              val screenCaptureLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  val data = result.data
                  if (result.resultCode == Activity.RESULT_OK && data != null) {
                      val requestedAt = System.currentTimeMillis()
                      val requestedMode = captureMode
                      ScreenCaptureService.startCapture(
                          context = context,
                          resultCode = result.resultCode,
                          resultData = data,
                          mode = requestedMode
                      )
                      if (requestedMode == ScreenCaptureService.MODE_ARMED) {
                          vm.onPhoneScreenArmed()
                      } else {
                          vm.onPhoneScreenCaptureStarted(requestedAt)
                      }
                      captureMode = ScreenCaptureService.MODE_IMMEDIATE
                  } else {
                      vm.onPhoneScreenCaptureDenied()
                  }
              }
              val notificationPermissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted ->
                  val shouldArm = pendingArmedPermission
                  pendingArmedPermission = false
                  if (granted && shouldArm) {
                      captureMode = ScreenCaptureService.MODE_ARMED
                      screenCaptureLauncher.launch(projectionManager.createScreenCaptureIntent())
                  } else if (shouldArm) {
                      vm.onPhoneScreenArmUnavailable()
                  }
              }
          
              MaterialTheme {
                  Surface(
                      modifier = Modifier
                          .fillMaxSize()
                          .statusBarsPadding()
                          .navigationBarsPadding()
                  ) {
                      if (state.loading) {
                          Column(
                              modifier = Modifier.fillMaxSize(),
                              verticalArrangement = Arrangement.Center
                          ) {
                              CircularProgressIndicator()
                          }
                          return@Surface
                      }
          
                      Scaffold(
                          bottomBar = {
                              NavigationBar {
                                  JadeTab.entries.forEach { item ->
                                      NavigationBarItem(
                                          selected = tab == item,
                                          onClick = { tab = item },
                                          icon = { Text(item.short) },
                                          label = { Text(item.label) }
                                      )
                                  }
                              }
                          }
                      ) { innerPadding ->
                          when (tab) {
                              JadeTab.JADE -> JadeHome(
                                  state = state,
                                  vm = vm,
                                  requestImmediateCapture = {
                                      captureMode = ScreenCaptureService.MODE_IMMEDIATE
                                      screenCaptureLauncher.launch(
                                          projectionManager.createScreenCaptureIntent()
                                      )
                                  },
                                  requestArmedCapture = {
                                      val needsNotificationPermission =
                                          Build.VERSION.SDK_INT >= 33 &&
                                              ContextCompat.checkSelfPermission(
                                                  context,
                                                  Manifest.permission.POST_NOTIFICATIONS
                                              ) != PackageManager.PERMISSION_GRANTED
                                      if (needsNotificationPermission) {
                                          pendingArmedPermission = true
                                          notificationPermissionLauncher.launch(
                                              Manifest.permission.POST_NOTIFICATIONS
                                          )
                                      } else {
                                          captureMode = ScreenCaptureService.MODE_ARMED
                                          screenCaptureLauncher.launch(
                                              projectionManager.createScreenCaptureIntent()
                                          )
                                      }
                                  },
                                  openFocusCrop = {
                                      context.startActivity(
                                          Intent(context, FocusCropActivity::class.java)
                                      )
                                  },
                                  modifier = Modifier.padding(innerPadding)
                              )
          
                              JadeTab.NODES -> NodesScreen(
                                  state = state,
                                  vm = vm,
                                  localNetworkGranted = localNetworkGranted,
                                  requestLocalNetwork = {
                                      localNetworkLauncher.launch(LOCAL_NETWORK_PERMISSION)
                                  },
                                  needsLocalNetworkPermission = needsLocalNetworkPermission,
                                  modifier = Modifier.padding(innerPadding)
                              )
          
                              JadeTab.ACTIVITY -> ActivityScreen(
                                  state = state,
                                  vm = vm,
                                  modifier = Modifier.padding(innerPadding)
                              )
          
                              JadeTab.MEMORY -> MemoryScreen(
                                  state = state,
                                  vm = vm,
                                  modifier = Modifier.padding(innerPadding)
                              )
          
                              JadeTab.ADMIN -> AdminScreen(
                                  state = state,
                                  vm = vm,
                                  modifier = Modifier.padding(innerPadding)
                              )
                          }
                      }
                  }
              }
          }
          
