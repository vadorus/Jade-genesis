name: Jade Node Runtime CI

on:
  push:
    branches:
      - main
      - "jade/**"
    paths:
      - "node-agent/**"
      - ".github/workflows/jade-node-runtime-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "node-agent/**"
      - ".github/workflows/jade-node-runtime-ci.yml"

permissions:
  contents: read

concurrency:
  group: jade-node-runtime-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Validate dependency-free Node Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile Node Runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            node-agent/jade_node_agent.py \
            node-agent/jade_node_runtime_core.py \
            node-agent/shared_genesis_state.py \
            node-agent/night_learning_lab.py \
            node-agent/vps_night_cycle.py \
            node-agent/test_night_learning_lab.py \
            node-agent/test_vps_night_cycle.py

      - name: Test bounded VPS Night Cycle and Learning Lab
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s node-agent \
            -p 'test_*.py' \
            -v

      - name: Validate telemetry and Shared State without external services
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import sys
          import tempfile
          from pathlib import Path

          node_dir = Path("node-agent").resolve()
          sys.path.insert(0, str(node_dir))

          path = node_dir / "jade_node_agent.py"
          spec = importlib.util.spec_from_file_location("jade_node_agent", path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert module.VERSION == "0.1.5"
          assert module.PROTOCOL == "jade-genesis-node/0.0.6"
          assert "brain_chat" in module.ALLOWED_TASKS
          assert "vision_analyze" in module.ALLOWED_TASKS
          assert "shared_state_sync" in module.ALLOWED_TASKS
          assert "night_learning_lab" not in module.ALLOWED_TASKS
          assert all("shell" not in task for task in module.ALLOWED_TASKS)

          cpu = module.cpu_load_percent(sample_seconds=0.02)
          assert cpu == -1.0 or 0.0 <= cpu <= 100.0

          gpu = module.gpu_telemetry()
          required = {
              "gpu_name",
              "gpu_vram_total_gb",
              "gpu_vram_free_gb",
              "gpu_utilization_percent",
          }
          assert required.issubset(gpu.keys())

          task_store = module.AsyncTaskStore({})
          assert task_store.stats() == {"active": 0, "queued": 0, "running": 0}

          from shared_genesis_state import SharedGenesisStateStore
          with tempfile.TemporaryDirectory(prefix="jade-state-") as temp_dir:
              state_store = SharedGenesisStateStore(Path(temp_dir) / "state.json")
              request = {
                  "schema_version": 1,
                  "identity_id": "jade-test",
                  "replica_id": "pixel-test",
                  "known_revision": 0,
                  "events": [{
                      "event_id": "event-1",
                      "origin_node": "pixel-test",
                      "kind": "identity_presence",
                      "entity_id": "jade-test",
                      "payload": "{}",
                      "created_at": 1000,
                  }],
              }
              first = state_store.sync(request)
              assert first["server_revision"] == 1
              assert first["server_head_revision"] == 1
              assert first["ack_event_ids"] == ["event-1"]
              assert len(first["events"]) == 1
              assert first["has_more"] is False

              second = state_store.sync(request)
              assert second["server_revision"] == 1
              assert second["ack_event_ids"] == ["event-1"]

              try:
                  state_store.sync({**request, "identity_id": "other-jade"})
              except ValueError as exc:
                  assert str(exc) == "shared_state_identity_mismatch"
              else:
                  raise AssertionError("identity mismatch should be rejected")

              bulk = []
              for index in range(2, 207):
                  bulk.append({
                      "event_id": f"event-{index}",
                      "origin_node": "pixel-test",
                      "kind": "test_event",
                      "entity_id": f"entity-{index}",
                      "payload": "{}",
                      "created_at": 1000 + index,
                  })
              state_store.sync({
                  "schema_version": 1,
                  "identity_id": "jade-test",
                  "replica_id": "pixel-test",
                  "known_revision": 1,
                  "events": bulk[:200],
              })
              paged = state_store.sync({
                  "schema_version": 1,
                  "identity_id": "jade-test",
                  "replica_id": "pixel-test",
                  "known_revision": 1,
                  "events": bulk[200:],
              })
              assert paged["server_revision"] == 201
              assert paged["server_head_revision"] == 206
              assert len(paged["events"]) == 200
              assert paged["has_more"] is True
              tail = state_store.sync({
                  "schema_version": 1,
                  "identity_id": "jade-test",
                  "replica_id": "pixel-test",
                  "known_revision": paged["server_revision"],
                  "events": [],
              })
              assert tail["server_revision"] == 206
              assert len(tail["events"]) == 5
              assert tail["has_more"] is False

          health = module.health_payload({
              "node_id": "vps-test",
              "node_kind": "VPS",
              "node_name": "VPS test",
              "runtime_channel": "stable",
              "ollama_url": "http://127.0.0.1:9",
          }, task_store)
          assert "shared_genesis_state_v1" in health["capabilities"]
          assert "shared_state_sync" in health["capabilities"]
          assert "vps_night_cycle_supervisor_v1" in health["capabilities"]
          assert "night_learning_lab_v1" in health["capabilities"]
          assert health["night_cycle_supervisor"]["mode"] == "bounded_learning_lab"
          assert health["night_cycle_supervisor"]["experiment_automatic"] is False
          assert health["night_cycle_supervisor"]["promotion_automatic"] is False
          assert health["night_cycle_supervisor"]["arbitrary_shell"] is False

          print("Node Runtime 0.1.5 + VPS Night Learning Lab validated.")
          PY

      - name: Prove validation did not rewrite sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --porcelain --untracked-files=no
