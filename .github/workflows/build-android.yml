name: Build Jade Genesis Android

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Extract Jade Genesis
        run: |
          unzip -q jade-genesis-android-0.0.1.zip

          sed -i 's/compileSdk = 37/compileSdk = 36/' \
            jade-genesis-android-0.0.1/app/build.gradle.kts

          sed -i 's/targetSdk = 37/targetSdk = 36/' \
            jade-genesis-android-0.0.1/app/build.gradle.kts

      - name: Build APK
        run: |
          gradle -p jade-genesis-android-0.0.1 :app:assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jade-Genesis-Android-0.0.1
          path: jade-genesis-android-0.0.1/app/build/outputs/apk/debug/*.apk
