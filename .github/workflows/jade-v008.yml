      - name: Test PC LocalPCBrain runtime with mock Ollama
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile node-agent/jade_node_agent.py

          TEST_DIR="$RUNNER_TEMP/jade-v008-runtime-test"
          mkdir -p "$TEST_DIR/config"

          cat > "$TEST_DIR/mock_ollama.py" <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path != "/api/tags":
                      self.send_response(404)
                      self.end_headers()
                      return
                  payload = json.dumps({
                      "models": [{
                          "name": "jade-test:1b",
                          "size": 123456789
                      }]
                  }).encode("utf-8")
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def do_POST(self):
                  if self.path != "/api/chat":
                      self.send_response(404)
                      self.end_headers()
                      return
                  length = int(self.headers.get("Content-Length", "0"))
                  request = json.loads(self.rfile.read(length).decode("utf-8"))
                  assert request["model"] == "jade-test:1b"
                  assert request["messages"][0]["role"] == "system"
                  payload = json.dumps({
                      "message": {
                          "role": "assistant",
                          "content": "Réponse locale de test Jade 0.0.8"
                      }
                  }).encode("utf-8")
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def log_message(self, *args):
                  pass

          HTTPServer(("127.0.0.1", 11435), Handler).serve_forever()
          PY

          python3 "$TEST_DIR/mock_ollama.py" &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true' EXIT
          sleep 0.3

          JADE_GENESIS_CONFIG_DIR="$TEST_DIR/config" python3 - <<'PY'
          import importlib.util
          import json

          spec = importlib.util.spec_from_file_location(
              "jade_node_agent",
              "node-agent/jade_node_agent.py",
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          config = module.load_or_create_config(
              8765,
              "http://127.0.0.1:11435",
              "jade-test:1b",
          )
          health = module.health_payload(config)
          assert health["brain_ready"] is True, health
          assert "local_brain" in health["capabilities"], health
          assert "brain_chat" in health["capabilities"], health

          payload = json.dumps({
              "identity": {
                  "name": "Jade Genesis",
                  "version": "0.0.8"
              },
              "user_input": "Présente-toi en une phrase.",
              "self": {
                  "node_id": "pixel-test",
                  "device": "Pixel test",
                  "resource_mode": "ECO",
                  "preferred_compute_node": "PC test"
              },
              "memories": [{
                  "type": "FACT",
                  "content": "mémoire de test",
                  "confidence": 1.0
              }]
          }, ensure_ascii=False)

          result, _ = module.execute_allowlisted_task(
              "brain_chat",
              payload,
              0,
              config,
          )
          decoded = json.loads(result)
          assert decoded["text"] == "Réponse locale de test Jade 0.0.8", decoded
          assert decoded["backend"] == "ollama", decoded
          assert decoded["local"] is True, decoded
          assert decoded["model"] == "jade-test:1b", decoded

          try:
              module.execute_allowlisted_task(
                  "shell_command",
                  "whoami",
                  0,
                  config,
              )
              raise AssertionError("arbitrary command unexpectedly allowed")
          except ValueError as exc:
              assert str(exc) == "unsupported_task"

          print("LocalPCBrain runtime mock test: SUCCESS")
          PY

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build Jade APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK and stable signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNATURE_OUTPUT"

          EXPECTED="0b74e3f3d627ebd7f53454caf8dca65312099de702171af8bfb3a674fd484992"
          ACTUAL="$(
            printf '%s\n' "$SIGNATURE_OUTPUT" \
              | sed -n 's/^.*certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d ':'
          )"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: stable Jade signing fingerprint mismatch."
            echo "Expected: $EXPECTED"
            echo "Actual  : $ACTUAL"
            exit 1
          fi

      - name: Store Jade 0.0.8 source in repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jade Genesis Builder"
          git config user.email "jade-genesis-builder@users.noreply.github.com"
          git add android node-agent

          if git diff --cached --quiet; then
            echo "Source already matches 0.0.8."
          else
            git commit -m "Jade Genesis Android 0.0.8 LocalPCBrain [skip ci]"
            git push origin HEAD:main
          fi

      - name: Package Jade Genesis 0.0.8 bundle
        shell: bash
        run: |
          set -euo pipefail
          cp node-agent/jade_node_agent.py Jade-Genesis-Node-Runtime-0.0.8.py
          cat > V0.0.8-NOTES.txt <<'EOF'
          Jade Genesis 0.0.8 — LocalPCBrain

          - Android versionCode 8 / versionName 0.0.8
          - Same persistent Jade identity and Room memory database
          - New LocalPCBrain BrainBackend
          - Local generative backend uses Ollama on the registered PC
          - No paid API required
          - Node Runtime version 0.0.8 keeps wire protocol jade-genesis-node/0.0.6 for compatibility
          - New allow-listed task: brain_chat
          - Dynamic health capability: brain_chat/local_brain only when Ollama + a conversational model are ready
          - Automatic BrainRouter fallback to Prototype Brain if the PC/Ollama request fails
          - Brain chat timeout extended to 120 seconds for first model load
          - No arbitrary shell/system commands
          - Existing node ID/token/config are preserved by the new runtime
          EOF

      - name: Upload Jade Genesis 0.0.8 bundle
        uses: actions/upload-artifact@v4
        with:
          name: Jade-Genesis-0.0.8
          if-no-files-found: error
          retention-days: 90
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            Jade-Genesis-Node-Runtime-0.0.8.py
            V0.0.8-NOTES.txt
